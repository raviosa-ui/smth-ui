<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TV63D6J6RW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TV63D6J6RW');
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - SocialMediaToolsHub</title>
    <link rel="canonical" href="https://socialmediatoolshub.com/contact-us">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
      (function () {
        emailjs.init("FnVjMcGz3ZRKXhAZm");
      })();
    </script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] }
          }
        }
      }
    </script>

    <style>
      body { background-color:#0f172a; color:#fff }
      footer { margin-top:60px; padding:40px 20px; text-align:center; border-top:1px solid rgba(255,255,255,.05) }
      .footer-nav { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-bottom:16px }
      .footer-nav a { color:#94a3b8; font-size:.9rem }
      .footer-nav a:hover { color:#fff }
      .copyright { color:#475569; font-size:.85rem }
    </style>
  </head>

  <body class="min-h-screen flex items-center justify-center relative">

    <div class="relative z-10 w-full max-w-4xl mx-auto p-4">

      <header class="mb-8 text-center">
        <h1 class="text-4xl md:text-6xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-200 via-purple-200 to-pink-200">
          Get in Touch
        </h1>
        <p class="text-slate-400 text-lg mt-2">
          Have a new tool in mind or found a bug? Message us.
        </p>
      </header>

      <!-- Success Message -->
      <div id="successMessage" class="hidden text-center space-y-6">
        <h2 class="text-4xl font-bold text-green-400">Thank You!</h2>
        <p class="text-xl text-slate-300">
          Your message was sent successfully.<br>
          We’ll reply within 24 hours.
        </p>
      </div>

      <!-- Form -->
      <div id="contactFormContainer" class="max-w-lg mx-auto">
        <form id="contactForm" class="space-y-6 bg-white/5 p-8 rounded-3xl border border-white/10">

          <input id="name" required placeholder="Your Name"
            class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3">

          <input id="subject" required placeholder="Subject"
            class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3">

          <textarea id="message" required rows="4" placeholder="Your message"
            class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 resize-none"></textarea>

          <button id="sendBtn" type="submit"
            class="w-full rounded-xl bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 px-6 py-4 font-semibold">
            Send Message
          </button>

        </form>
      </div>

      <footer>
        <nav class="footer-nav">
          <a href="/about-us">About Us</a>
          <a href="/contact-us">Contact</a>
          <a href="/privacy">Privacy Policy</a>
          <a href="/terms">Terms</a>
          <a href="/cookie-policy">Cookies</a>
        </nav>
        <div class="copyright">
          © 2025 SocialMediaToolsHub. Built for speed.
        </div>
      </footer>

    </div>

    <!-- EmailJS Logic -->
    <script>
      const form = document.getElementById("contactForm");
      const btn = document.getElementById("sendBtn");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "Sending…";

        emailjs.send(
          "service_ygz2n8i",
          "template_nsx4v69",
          {
            name: document.getElementById("name").value,
            subject: document.getElementById("subject").value,
            message: document.getElementById("message").value
          }
        ).then(() => {
          document.getElementById("contactFormContainer").classList.add("hidden");
          document.getElementById("successMessage").classList.remove("hidden");
        }).catch(() => {
          alert("Failed to send message. Please try again later.");
          btn.disabled = false;
          btn.textContent = "Send Message";
        });
      });
    </script>

  </body>
</html>
