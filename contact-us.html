<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'blob': 'blob 10s infinite',
              'fade-in': 'fadeIn 0.8s ease-out forwards',
              'slide-up': 'slideUp 0.6s ease-out forwards',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    
    <!-- Custom Styles -->
    <style>
      body {
        background-color: #0f172a;
        color: #fff;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
</head>
  <body class="selection:bg-purple-500/30 min-h-screen flex items-center justify-center relative">
    
    <!-- === BACKGROUND ANIMATIONS === -->
    <div class="fixed inset-0 w-full h-full pointer-events-none overflow-hidden z-0">
        <div class="absolute inset-0 bg-slate-900"></div>
        
        <!-- Animated Blobs -->
        <div class="absolute top-0 -left-4 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
        <div class="absolute top-0 -right-4 w-96 h-96 bg-yellow-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000" style="animation-delay: 2s"></div>
        <div class="absolute -bottom-8 left-20 w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000" style="animation-delay: 4s"></div>
        
        <!-- Smooth Gradient Overlay -->
        <div class="absolute inset-0 bg-gradient-to-b from-slate-900/50 via-slate-900/20 to-slate-900/90"></div>
        
        <!-- Grain/Noise Texture for Premium Feel -->
        <div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%221%22/%3E%3C/svg%3E');"></div>
    </div>

    <!-- === MAIN CONTENT === -->
    <div class="relative z-10 w-full max-w-4xl mx-auto flex flex-col items-center justify-center p-4">
        
        <!-- Header -->
        <header class="mb-8 text-center animate-slide-up">
            <h1 class="text-4xl md:text-6xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-200 via-purple-200 to-pink-200 tracking-tight mb-3">
                Get in Touch
            </h1>
            <p class="text-slate-400 text-lg max-w-md mx-auto font-light leading-relaxed">
                Have a project in mind? Send us a secure message directly.
            </p>
        </header>

        <!-- Form Container -->
        <div class="w-full max-w-lg relative group animate-slide-up" style="animation-delay: 0.1s">
            
            <!-- Glassmorphism Card -->
            <div class="relative overflow-hidden rounded-3xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-2xl transition-all duration-500 hover:shadow-purple-500/10 hover:border-white/20">
                
                <!-- Shine Hover Effect -->
                <div class="absolute top-0 left-[-100%] w-[200%] h-full bg-gradient-to-r from-transparent via-white/5 to-transparent skew-x-12 pointer-events-none transition-transform duration-1000 group-hover:translate-x-1/2"></div>

                <form id="contactForm" class="p-8 md:p-10 space-y-6 relative z-10">
                    
                    <!-- Name Input -->
                    <div class="space-y-2">
                        <label for="name" class="text-sm font-medium text-slate-300 flex items-center gap-2 transition-colors group-focus-within:text-purple-300">
                            <!-- User Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-400"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            Your Name
                        </label>
                        <input type="text" id="name" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500/50 transition-all duration-300" placeholder="Jane Doe">
                        <p id="error-name" class="text-red-400 text-xs ml-1 hidden font-medium">Name is required</p>
                    </div>

                    <!-- Subject Input -->
                    <div class="space-y-2">
                        <label for="subject" class="text-sm font-medium text-slate-300 flex items-center gap-2 transition-colors group-focus-within:text-blue-300">
                            <!-- Pen Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
                            Subject
                        </label>
                        <input type="text" id="subject" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500/50 transition-all duration-300" placeholder="Project Inquiry">
                        <p id="error-subject" class="text-red-400 text-xs ml-1 hidden font-medium">Subject is required</p>
                    </div>

                    <!-- Message Input -->
                    <div class="space-y-2">
                        <label for="message" class="text-sm font-medium text-slate-300 flex items-center gap-2 transition-colors group-focus-within:text-pink-300">
                            <!-- Message Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-pink-400"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            Message
                        </label>
                        <textarea id="message" rows="4" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500/50 transition-all duration-300 resize-none" placeholder="Tell us about your ideas..."></textarea>
                        <p id="error-message" class="text-red-400 text-xs ml-1 hidden font-medium">Message is required</p>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full relative group overflow-hidden rounded-xl bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 p-[1px] transition-all duration-300 hover:shadow-[0_0_2rem_-0.5rem_#8b5cf6] hover:scale-[1.01] active:scale-[0.99]">
                        <div class="relative h-full w-full bg-slate-900/90 rounded-xl px-6 py-4 flex items-center justify-center gap-3 transition-all duration-300 group-hover:bg-transparent">
                            <span class="font-semibold text-white tracking-wide">Send Message</span>
                            <!-- Send Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white transition-transform duration-500 group-hover:translate-x-1 group-hover:-translate-y-1"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </div>
                        <!-- Glow -->
                        <div class="absolute inset-0 bg-white/20 translate-y-full blur-lg transition-transform duration-500 group-hover:translate-y-0"></div>
                    </button>

                </form>
            </div>
        </div>
        
        <footer class="mt-12 text-slate-600 text-sm font-light animate-[fadeIn_2s_ease-in_forwards]">
            &copy; <span id="year"></span> Studio Glass. All rights reserved.
        </footer>
    </div>

    <!-- === JAVASCRIPT LOGIC === -->
    <script>
        // --- CONFIGURATION ---
        
        // PASTE YOUR BASE64 ENCODED EMAIL HERE
        // Example: btoa("hello@designstudio.com") -> "aGVsbG9AZGVzaWduc3R1ZGlvLmNvbQ=="
        const ENCODED_EMAIL = "c29jaWFsbWVkaWF0b29sc2h1YkBnbWFpbC5jb20="; 

        // ---------------------

        // Initialize Year
        document.getElementById('year').textContent = new Date().getFullYear();

        // DOM Elements
        const form = document.getElementById('contactForm');
        const fields = {
            name: document.getElementById('name'),
            subject: document.getElementById('subject'),
            message: document.getElementById('message')
        };
        const errors = {
            name: document.getElementById('error-name'),
            subject: document.getElementById('error-subject'),
            message: document.getElementById('error-message')
        };

        // Real-time Validation (Clear errors on type)
        Object.keys(fields).forEach(key => {
            fields[key].addEventListener('input', () => {
                fields[key].classList.remove('border-red-500/50', 'focus:border-red-500');
                fields[key].classList.add('border-white/10');
                errors[key].classList.add('hidden');
            });
        });

        // Submit Handler
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            let isValid = true;

            // Check Validity
            Object.keys(fields).forEach(key => {
                if (!fields[key].value.trim()) {
                    fields[key].classList.remove('border-white/10');
                    fields[key].classList.add('border-red-500/50', 'focus:border-red-500');
                    errors[key].classList.remove('hidden');
                    isValid = false;
                    
                    // Shake animation effect (simple class toggle)
                    fields[key].classList.add('translate-x-1');
                    setTimeout(() => fields[key].classList.remove('translate-x-1'), 100);
                }
            });

            if (!isValid) return;

            // Security & Logic
            try {
                // 1. Decode Email (atob)
                // This happens ONLY on click, keeping the address hidden from simple scrapers.
                const recipient = atob(ENCODED_EMAIL);
                
                // 2. Prepare Data
                const subject = encodeURIComponent(fields.subject.value);
                // Format the body for readability
                const body = encodeURIComponent(
                    `Name: ${fields.name.value}\n\nMessage:\n${fields.message.value}`
                );

                // 3. Trigger Mail Client
                window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
                
            } catch (err) {
                console.error('Error processing form:', err);
                alert('An error occurred. Please ensure your default email client is configured.');
            }
        });
    </script>
  </body>
</html>
