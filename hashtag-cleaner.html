<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hashtag Cleaner — SocialMediaToolsKit</title>
  <meta name="description" content="Clean, dedupe and format hashtags for Instagram, TikTok & more. Remove duplicates, strip punctuation and copy ready-to-paste lists." />
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific tweaks that blend with your theme */
    .tool-card{max-width:980px;margin:18px auto;padding:18px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,0.01),rgba(255,255,255,0.00));box-shadow:0 6px 22px rgba(3,7,18,0.6);border:1px solid var(--border)}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
    .controls > *{margin:0}
    textarea.input{width:100%;min-height:140px;border-radius:12px;padding:12px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px;resize:vertical}
    .output{width:100%;min-height:120px;border-radius:12px;padding:12px;border:1px dashed rgba(255,255,255,0.04);background:transparent;color:var(--text);font-size:14px;white-space:pre-wrap}
    .small{font-size:13px;color:var(--muted)}
    .btn{padding:10px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:600;background:linear-gradient(90deg,var(--accent-from),var(--accent-to));color:#06121f}
    .muted-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 10px;border-radius:10px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .stats{display:flex;gap:12px;align-items:center}
    .toggle{display:flex;gap:6px;align-items:center}
    .blacklist-box{margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.01)}
    .blacklist-box textarea{width:100%;min-height:70px;padding:10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);resize:vertical}
    .blacklist-actions{display:flex;gap:8px;align-items:center;margin-top:8px}
    @media(min-width:720px){ .controls{gap:14px} .row{flex-wrap:nowrap} }
  </style>
</head>
<body>
  <div class="container">
    <header class="header" role="banner">
      <div class="brand" aria-label="SocialMediaToolsKit">
        <span class="brand-emoji" aria-hidden="true">⚡</span>
        <span class="logo-text">SocialMediaToolsKit</span>
      </div>

      <nav class="topnav" role="navigation" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="#how">How</a>
      </nav>
    </header>

    <main>
      <section class="tool-card" aria-labelledby="tool-title">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px">
          <div>
            <h1 id="tool-title" style="margin:0;font-size:18px">Hashtag Cleaner</h1>
            <p class="small" style="margin:6px 0 0">Paste caption or hashtags — clean, dedupe and format for posting.</p>
          </div>

          <div class="stats" aria-hidden="false" style="text-align:right">
            <div class="small">Total: <strong id="total-count">0</strong></div>
            <div class="small">Unique: <strong id="unique-count">0</strong></div>
          </div>
        </div>

        <!-- Input -->
        <label for="input-text" class="small">Input (caption, hashtags or both)</label>
        <textarea id="input-text" class="input" placeholder="Paste caption with hashtags here — e.g. Loved the sunset! #sunset #Travel #travel"></textarea>

        <!-- Controls -->
        <div class="controls" style="margin-top:12px">
          <div class="row" style="flex:1">
            <button id="clean-btn" class="btn" type="button">Clean</button>
            <button id="copy-btn" class="btn" type="button">Copy Clean Hashtags</button>
            <button id="clear-btn" class="muted-btn" type="button">Clear</button>
          </div>

          <div style="display:flex;gap:10px;align-items:center">
            <label class="small" for="sort-select">Sort</label>
            <select id="sort-select" aria-label="Sort hashtags" class="muted-btn" style="padding:8px;border-radius:10px;background:transparent;border:1px solid var(--border);color:var(--muted)">
              <option value="none">None (input order)</option>
              <option value="alpha">A → Z</option>
              <option value="length">Longest → Shortest</option>
              <option value="random">Random</option>
            </select>
          </div>

          <div class="toggle" title="Output format">
            <label class="small">Format</label>
            <label style="display:flex;gap:6px;align-items:center"><input id="one-line" type="radio" name="format" checked> <span class="small">Single line</span></label>
            <label style="display:flex;gap:6px;align-items:center"><input id="one-per-line" type="radio" name="format"> <span class="small">One per line</span></label>
          </div>
        </div>

        <!-- Additional options: Hashify + Blacklist -->
        <div class="blacklist-box" aria-label="Options: auto-hashify and blacklist">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
            <div class="toggle" style="gap:12px;align-items:center">
              <label style="display:flex;gap:8px;align-items:center"><input id="hashify-toggle" type="checkbox"> <span class="small">Automatic hashify (convert words → hashtags)</span></label>
              <label style="display:flex;gap:8px;align-items:center"><input id="use-blacklist-toggle" type="checkbox"> <span class="small">Use blacklist</span></label>
            </div>

            <div style="text-align:right">
              <div class="small">Blacklist saved: <strong id="blacklist-count">0</strong></div>
            </div>
          </div>

          <label class="small" for="blacklist-area" style="display:block;margin-top:10px">Blacklist (one per line or comma-separated). Tags entered with or without '#' will be normalized.</label>
          <textarea id="blacklist-area" placeholder="#spam, follow4follow, like4like"></textarea>

          <div class="blacklist-actions">
            <button id="save-blacklist" class="muted-btn" type="button">Save Blacklist</button>
            <button id="clear-blacklist" class="muted-btn" type="button">Clear Blacklist</button>
            <div class="small" id="blacklist-status" style="color:var(--muted)"></div>
          </div>
        </div>

        <!-- Output -->
        <label for="output" class="small" style="margin-top:12px">Cleaned Hashtag
