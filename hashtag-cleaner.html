<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hashtag Cleaner — SocialMediaToolsKit</title>
  <meta name="description" content="Clean, dedupe and format hashtags for Instagram, TikTok & more. Remove duplicates, strip punctuation and copy ready-to-paste lists." />
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific tweaks that blend with your theme */
    .tool-card{max-width:980px;margin:18px auto;padding:18px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,0.01),rgba(255,255,255,0.00));box-shadow:0 6px 22px rgba(3,7,18,0.6);border:1px solid var(--border)}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
    .controls > *{margin:0}
    textarea.input{width:100%;min-height:140px;border-radius:12px;padding:12px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px;resize:vertical}
    .output{width:100%;min-height:120px;border-radius:12px;padding:12px;border:1px dashed rgba(255,255,255,0.04);background:transparent;color:var(--text);font-size:14px;white-space:pre-wrap}
    .small{font-size:13px;color:var(--muted)}
    .btn{padding:10px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:600;background:linear-gradient(90deg,var(--accent-from),var(--accent-to));color:#06121f}
    .muted-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 10px;border-radius:10px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .stats{display:flex;gap:12px;align-items:center}
    .toggle{display:flex;gap:6px;align-items:center}
    @media(min-width:720px){ .controls{gap:14px} .row{flex-wrap:nowrap} }

    /* FAQ styling */
    .content-area{max-width:980px;margin:22px auto 40px;color:var(--muted);padding:0 6px}
    .content-area h3{color:var(--text);margin:14px 0 6px;font-size:16px}
    .faq{background:transparent;border-radius:12px;padding:10px}
    .faq dt{font-weight:700;color:var(--text);margin-top:12px}
    .faq dd{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.6}
  </style>
</head>
<body>

    <header class="header" role="banner">
      <div class="brand" aria-label="SocialMediaToolsKit">
        <span class="brand-emoji" aria-hidden="true">⚡</span>
        <span class="logo-text">SocialMediaToolsKit</span>
      </div>
