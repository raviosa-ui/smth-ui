<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You - SocialMediaToolsHub</title>
  <meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://socialmediatoolshub.com/">

  <script src="https://cdn.tailwindcss.com"></script>
     <link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }}}}
  </script>
  <style>
    body { background-color: #0f172a; color: #fff; }
    .blob { animation: blob 10s infinite; }
    @keyframes blob { 0%,100%{transform:translate(0px,0px) scale(1)} 33%{transform:translate(30px,-50px) scale(1.1)} 66%{transform:translate(-20px,20px) scale(0.9)} }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
  <div class="fixed inset-0 pointer-events-none">
    <div class="absolute inset-0 bg-slate-900"></div>
    <div class="absolute top-0 -left-4 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 blob"></div>
    <div class="absolute top-0 -right-4 w-96 h-96 bg-yellow-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 blob" style="animation-delay:2s"></div>
    <div class="absolute -bottom-8 left-20 w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 blob" style="animation-delay:4s"></div>
  </div>

  <div class="relative z-10 text-center px-6">
    <svg class="w-24 h-24 mx-auto mb-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <h1 class="text-5xl md:text-6xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-200 to-teal-200 mb-4">
      Thank You!
    </h1>
    <p class="text-xl md:text-2xl text-slate-300 max-w-lg mx-auto">
      Your message was sent successfully.<br>
      We’ll reply to you within 24 hours.
    </p>
    <a href="https://socialmediatoolshub.com" class="mt-10 inline-block px-8 py-4 bg-gradient-to-r from-purple-600 to-pink-600 rounded-xl font-medium hover:scale-105 transition">
      ← Back to Home
    </a>
  </div>
</body>
</html>
