<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG ASMR Draw Recorder Pro</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .canvas-container {
            aspect-ratio: 16 / 9;
            background-size: cover;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: #60a5fa;
            cursor: pointer;
            margin-top: -6px; 
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: #4b5563;
            border-radius: 2px;
        }

        .paper-texture-1 { background-color: #fdfbf7; background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E"); }
        .paper-texture-2 { background-color: #e3dacd; background-image: radial-gradient(#d4c5b0 1px, transparent 0); background-size: 20px 20px; }
        .paper-texture-3 { background-color: #1a1a1a; background-image: linear-gradient(#262626 1px, transparent 1px), linear-gradient(90deg, #262626 1px, transparent 1px); background-size: 40px 40px; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
</head>
<body class="bg-gray-900 text-white h-screen flex overflow-hidden selection:bg-blue-500 selection:text-white">

    <!-- Sidebar Controls -->
    <aside class="w-80 bg-gray-800 border-r border-gray-700 flex flex-col z-10 shadow-xl">
        
        <!-- Social / Promo Header -->
        <div class="p-4 bg-gray-900 border-b border-gray-700 space-y-3">
            <a href="https://wa.me/?text=Check%20out%20this%20amazing%20SVG%20ASMR%20Recorder!%20Create%20satisfying%20drawing%20videos%20easily." 
               target="_blank" 
               class="w-full bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center transform hover:-translate-y-0.5">
                <i class="fab fa-whatsapp text-2xl mr-2"></i>
                <span>Share to WhatsApp</span>
            </a>
            <div class="text-center">
                <a href="/" class="text-xs text-gray-500 hover:text-blue-400 transition-colors font-medium">
                    Powered by SocialMediaToolsHub
                </a>
            </div>
        </div>

        <div class="p-5 border-b border-gray-700 bg-gray-900">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
                <i class="fas fa-pen-fancy mr-2 text-white"></i>ASMR Draw Pro
            </h1>
            <p class="text-xs text-gray-400 mt-1">SVG to Realistic Video Recorder</p>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-6">
            
            <!-- Upload -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Source File</label>
                <div class="relative group">
                    <input type="file" id="fileInput" accept=".svg" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="border-2 border-dashed border-gray-600 rounded-lg p-4 text-center group-hover:border-blue-500 group-hover:bg-gray-700 transition-all">
                        <i class="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-2"></i>
                        <p class="text-sm text-gray-300">Drop SVG or Click</p>
                    </div>
                </div>
            </div>

            <!-- Drawing Settings -->
            <div class="space-y-4">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Pen Dynamics</label>
                
                <!-- Speed -->
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span>Speed</span>
                        <span id="speedVal" class="text-blue-400">1.5x</span>
                    </div>
                    <input type="range" id="speedRange" min="0.5" max="5.0" step="0.1" value="1.5">
                </div>

                <!-- Color -->
                <div class="flex items-center justify-between">
                    <span class="text-sm">Ink Color</span>
                    <input type="color" id="inkColor" value="#000000" class="h-8 w-14 bg-transparent border border-gray-600 rounded cursor-pointer">
                </div>
                
                <!-- Style -->
                <div>
                    <span class="text-sm block mb-2">Pen Style</span>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setPenType('ballpoint')" class="pen-btn active bg-blue-600 text-xs py-1 px-2 rounded border border-blue-500">Ballpoint</button>
                        <button onclick="setPenType('marker')" class="pen-btn bg-gray-700 hover:bg-gray-600 text-xs py-1 px-2 rounded border border-gray-600">Marker</button>
                        <button onclick="setPenType('chalk')" class="pen-btn bg-gray-700 hover:bg-gray-600 text-xs py-1 px-2 rounded border border-gray-600">Chalk</button>
                    </div>
                </div>
            </div>

            <!-- Paper Settings -->
            <div class="space-y-3">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Paper & Canvas</label>
                <div class="flex gap-2">
                    <div onclick="setPaper(1)" class="w-10 h-10 rounded-full cursor-pointer ring-2 ring-transparent hover:ring-blue-500 paper-texture-1 border border-gray-500"></div>
                    <div onclick="setPaper(2)" class="w-10 h-10 rounded-full cursor-pointer ring-2 ring-transparent hover:ring-blue-500 paper-texture-2 border border-gray-500"></div>
                    <div onclick="setPaper(3)" class="w-10 h-10 rounded-full cursor-pointer ring-2 ring-transparent hover:ring-blue-500 paper-texture-3 border border-gray-500"></div>
                </div>
            </div>

            <!-- Signature -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Signature</label>
                <input type="text" id="signatureInput" placeholder="Sign your work..." class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <!-- Stats -->
            <div class="p-3 bg-gray-900 rounded border border-gray-700 text-xs space-y-1 font-mono text-gray-400">
                <div class="flex justify-between"><span>Paths:</span> <span id="pathCount">0</span></div>
                <div class="flex justify-between"><span>Resolution:</span> <span>1920x1080</span></div>
            </div>

        </div>

        <!-- Action Buttons -->
        <div class="p-5 border-t border-gray-700 space-y-3 bg-gray-900">
            <button id="startBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded shadow-lg flex items-center justify-center transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fas fa-video mr-2"></i> Record ASMR Video
            </button>
            <button id="previewBtn" class="w-full bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded shadow flex items-center justify-center transition-all">
                <i class="fas fa-play mr-2"></i> Preview Only
            </button>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 bg-gray-950 flex flex-col items-center justify-center relative p-10 overflow-hidden">
        
        <!-- Status Overlay -->
        <div id="statusOverlay" class="absolute top-5 bg-gray-800/90 backdrop-blur text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-4 z-50 transform -translate-y-20 transition-transform duration-300 border border-gray-700">
            <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
            <span id="statusText" class="font-mono text-sm">Recording...</span>
            <span id="timer" class="font-mono text-sm font-bold text-red-400">00:00</span>
        </div>

        <!-- The Canvas (16:9 Aspect Ratio) -->
        <div class="relative w-full max-w-6xl shadow-2xl border border-gray-800">
            <!-- Hidden SVG container for parsing -->
            <div id="hiddenSvgContainer" style="display: none;"></div>
            
            <canvas id="mainCanvas" width="1920" height="1080" class="w-full h-auto block paper-texture-1 transition-colors duration-500"></canvas>
            
            <!-- Download Overlay (Hidden by default) -->
            <div id="downloadOverlay" class="absolute inset-0 bg-gray-900/95 z-50 flex flex-col items-center justify-center hidden">
                <i class="fas fa-check-circle text-6xl text-green-500 mb-4"></i>
                <h2 class="text-2xl font-bold text-white mb-2">Masterpiece Created!</h2>
                <p class="text-gray-400 mb-6">Your ASMR drawing video is ready.</p>
                <a id="downloadLink" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform hover:scale-105 flex items-center cursor-pointer">
                    <i class="fas fa-download mr-2"></i> Download Video
                </a>
                <button onclick="document.getElementById('downloadOverlay').classList.add('hidden')" class="mt-4 text-sm text-gray-500 hover:text-white underline">Close</button>
            </div>
        </div>

    </main>

    <script>
        // --- CONSTANTS & CONFIG ---
        const CANVAS_WIDTH = 1920;
        const CANVAS_HEIGHT = 1080;
        
        // --- DOM ELEMENTS ---
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');
        const startBtn = document.getElementById('startBtn');
        const previewBtn = document.getElementById('previewBtn');
        const statusOverlay = document.getElementById('statusOverlay');
        const statusText = document.getElementById('statusText');
        const timerDisplay = document.getElementById('timer');
        const speedInput = document.getElementById('speedRange');
        const speedVal = document.getElementById('speedVal');
        const inkColorInput = document.getElementById('inkColor');
        const signatureInput = document.getElementById('signatureInput');
        const pathCountDisplay = document.getElementById('pathCount');

        // --- STATE ---
        let paths = []; // Array of { d: Path2D, length: number, points: SVGPathElement }
        let currentPen = {
            type: 'ballpoint',
            color: '#000000',
            width: 3,
            pressure: 1
        };
        let isDrawing = false;
        let isRecording = false;
        let animationId = null;
        
        // Recording State
        let mediaRecorder;
        let recordedChunks = [];
        let audioCtx;
        let destNode; // Audio destination for recording
        let masterGain;

        // ASMR Audio Synth Nodes
        let noiseNode = null;
        let noiseFilter = null;
        let noiseGain = null;

        // --- INITIALIZATION ---
        
        // Resize logic to keep canvas looking good in CSS
        function fitCanvas() {
            // CSS handles visual resizing, canvas internal resolution stays 1920x1080
        }
        window.addEventListener('resize', fitCanvas);

        // --- AUDIO ENGINE (Procedural ASMR) ---
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                destNode = audioCtx.createMediaStreamDestination();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.8; // Master volume
                masterGain.connect(audioCtx.destination); // For speakers
                masterGain.connect(destNode); // For recording
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Create Brown Noise Buffer (sounds like paper texture)
        function createNoiseBuffer() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 2; // 2 seconds
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            let lastOut = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                // Brown noise filter (integrate white noise)
                data[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = data[i];
                data[i] *= 3.5; // Compensate for gain loss
            }
            return buffer;
        }

        function startPenSound() {
            if (!audioCtx) initAudio();
            
            // Source
            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = createNoiseBuffer();
            noiseNode.loop = true;

            // Filter (Bandpass to isolate scratchy frequencies)
            noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            
            // Adjust filter based on pen type
            if (currentPen.type === 'marker') {
                noiseFilter.frequency.value = 400; // Lower thud
                noiseFilter.Q.value = 0.5;
            } else if (currentPen.type === 'chalk') {
                noiseFilter.frequency.value = 800; // Dry scratch
                noiseFilter.Q.value = 1;
            } else {
                noiseFilter.frequency.value = 1200; // Ballpoint/Fine
                noiseFilter.Q.value = 0.8;
            }

            // Envelope/Gain
            noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0; // Start silent

            // Connect graph
            noiseNode.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(masterGain);

            noiseNode.start();
        }

        function updatePenSound(speed) {
            if (!noiseGain || !noiseNode) return;
            
            // ASMR Logic: Faster drawing = louder & slightly higher pitch
            const baseVol = currentPen.type === 'marker' ? 0.3 : 0.15;
            const targetVol = speed > 0 ? baseVol + (speed * 0.05) : 0;
            
            // Smooth volume transition
            noiseGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.05);

            // Pitch shift based on speed (detune in cents)
            const baseDetune = 0;
            const speedDetune = speed * 100; // drawing fast raises pitch
            noiseNode.detune.setTargetAtTime(baseDetune + speedDetune, audioCtx.currentTime, 0.1);
        }

        function stopPenSound() {
            if (noiseGain) {
                noiseGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
            }
            if (noiseNode) {
                noiseNode.stop(audioCtx.currentTime + 0.2);
                noiseNode = null;
            }
        }

        // --- SVG PROCESSING ---

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => parseSVG(event.target.result);
                reader.readAsText(file);
            }
        });

        // Add a demo drawing on load
        window.addEventListener('DOMContentLoaded', () => {
            // Simple flower demo SVG
            const demoSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 90 Q 50 50 50 10" stroke="black" fill="none"/> 
                <circle cx="50" cy="50" r="10" stroke="black" fill="none"/>
                <path d="M50 50 Q 70 20 90 50 Q 70 80 50 50" stroke="black" fill="none"/>
                <path d="M50 50 Q 30 20 10 50 Q 30 80 50 50" stroke="black" fill="none"/>
                <path d="M50 50 Q 20 30 50 10 Q 80 30 50 50" stroke="black" fill="none"/>
                <path d="M50 50 Q 20 70 50 90 Q 80 70 50 50" stroke="black" fill="none"/>
            </svg>`;
            parseSVG(demoSVG);
        });

        function parseSVG(svgString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(svgString, 'image/svg+xml');
            const svgEl = doc.querySelector('svg');
            
            if (!svgEl) return;

            // Normalize viewbox
            let viewBox = svgEl.getAttribute('viewBox');
            let width = svgEl.getAttribute('width');
            let height = svgEl.getAttribute('height');

            if (!viewBox && width && height) {
                viewBox = `0 0 ${parseFloat(width)} ${parseFloat(height)}`;
            } else if (!viewBox) {
                viewBox = '0 0 100 100'; // Fallback
            }

            const vb = viewBox.split(/[\s,]+/).map(parseFloat);
            const vbW = vb[2];
            const vbH = vb[3];
            const vbX = vb[0];
            const vbY = vb[1];

            // Calculate scaling to fit 1920x1080 with padding
            const padding = 150;
            const targetW = CANVAS_WIDTH - (padding * 2);
            const targetH = CANVAS_HEIGHT - (padding * 2);
            const scale = Math.min(targetW / vbW, targetH / vbH);
            
            const offsetX = (CANVAS_WIDTH - (vbW * scale)) / 2 - (vbX * scale);
            const offsetY = (CANVAS_HEIGHT - (vbH * scale)) / 2 - (vbY * scale);

            paths = [];
            
            // Helper to get all shape elements and convert to paths (simplified)
            // Note: In a real "Pro" app, we'd use a library like flattened-image to handle transforms. 
            // Here we do basic extraction.
            const elements = svgEl.querySelectorAll('path, line, polyline, polygon, rect, circle, ellipse');
            
            // Temporary container to use browser's getPointAtLength logic
            const tempContainer = document.getElementById('hiddenSvgContainer');
            tempContainer.innerHTML = '';
            
            elements.forEach(el => {
                // Clone and strip transforms if possible (complex transforms are hard in vanilla without libs)
                // Ideally, we just grab the path data.
                
                let pathData = '';
                
                if (el.tagName === 'path') {
                    pathData = el.getAttribute('d');
                } else if (el.tagName === 'line') {
                    pathData = `M${el.getAttribute('x1')},${el.getAttribute('y1')} L${el.getAttribute('x2')},${el.getAttribute('y2')}`;
                } else if (el.tagName === 'rect') {
                    const x = parseFloat(el.getAttribute('x')||0);
                    const y = parseFloat(el.getAttribute('y')||0);
                    const w = parseFloat(el.getAttribute('width'));
                    const h = parseFloat(el.getAttribute('height'));
                    pathData = `M${x},${y} L${x+w},${y} L${x+w},${y+h} L${x},${y+h} Z`;
                } else if (el.tagName === 'circle') {
                    const cx = parseFloat(el.getAttribute('cx')||0);
                    const cy = parseFloat(el.getAttribute('cy')||0);
                    const r = parseFloat(el.getAttribute('r'));
                    pathData = `M${cx-r},${cy} a${r},${r} 0 1,0 ${r*2},0 a${r},${r} 0 1,0 -${r*2},0`;
                }
                // (Omitted polyline/ellipse for brevity, similar logic)

                if (pathData) {
                    const tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    tempPath.setAttribute('d', pathData);
                    tempContainer.appendChild(tempPath);
                    
                    const len = tempPath.getTotalLength();
                    if (len > 0) {
                        paths.push({
                            element: tempPath,
                            length: len,
                            scale: scale,
                            offsetX: offsetX,
                            offsetY: offsetY
                        });
                    }
                }
            });

            pathCountDisplay.innerText = paths.length;
            drawStaticPreview();
        }

        // --- DRAWING LOGIC ---

        function drawStaticPreview() {
            clearCanvas();
            ctx.globalAlpha = 0.2; // Faint preview
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 1;
            
            paths.forEach(p => {
                const len = p.length;
                const step = 10; // low res preview
                ctx.beginPath();
                for(let i=0; i<=len; i+=step) {
                    const pt = p.element.getPointAtLength(i);
                    const x = pt.x * p.scale + p.offsetX;
                    const y = pt.y * p.scale + p.offsetY;
                    if(i===0) ctx.moveTo(x,y);
                    else ctx.lineTo(x,y);
                }
                ctx.stroke();
            });
            ctx.globalAlpha = 1.0;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            // Redraw background texture logic is handled by CSS on the canvas element mostly, 
            // but for recording we need to draw it onto the context.
            
            // Get current bg color from CSS
            const computedStyle = window.getComputedStyle(canvas);
            ctx.fillStyle = computedStyle.backgroundColor;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Simple noise pattern drawing for recording (since CSS bg isn't captured by MediaStream)
            // We simulate the selected class visual
            if (canvas.classList.contains('paper-texture-2')) {
                ctx.fillStyle = '#d4c5b0';
                for(let i=0; i<CANVAS_WIDTH; i+=20) {
                    for(let j=0; j<CANVAS_HEIGHT; j+=20) {
                        if(Math.random()>0.5) ctx.fillRect(i,j,1,1);
                    }
                }
            } else if (canvas.classList.contains('paper-texture-3')) {
                // Grid
                 ctx.strokeStyle = '#262626';
                 ctx.lineWidth = 1;
                 ctx.beginPath();
                 for(let i=0; i<CANVAS_WIDTH; i+=40) { ctx.moveTo(i,0); ctx.lineTo(i, CANVAS_HEIGHT); }
                 for(let j=0; j<CANVAS_HEIGHT; j+=40) { ctx.moveTo(0,j); ctx.lineTo(CANVAS_WIDTH, j); }
                 ctx.stroke();
            }
        }

        function drawPenCursor(x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            
            // Add some wobble to the pen angle for realism
            const wobble = Math.sin(Date.now() / 200) * 0.05;
            ctx.rotate(0.5 + wobble); // Standard writing grip angle

            // Shadow
            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;

            // Draw Pen Body
            const grad = ctx.createLinearGradient(0,0, 20, -100);
            grad.addColorStop(0, '#333');
            grad.addColorStop(0.5, '#777');
            grad.addColorStop(1, '#333');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0, 0); // Tip
            ctx.lineTo(15, -15);
            ctx.lineTo(20, -150); // End of pen
            ctx.lineTo(-5, -150);
            ctx.lineTo(-10, -15);
            ctx.closePath();
            ctx.fill();
            
            // Pen Tip color (matches ink)
            ctx.fillStyle = currentPen.color;
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.lineTo(5, -15);
            ctx.lineTo(-5, -15);
            ctx.fill();

            ctx.restore();
        }

        async function animateDrawing(isPreview) {
            if (isDrawing) return;
            isDrawing = true;
            
            // UI Update
            startBtn.disabled = true;
            fileInput.disabled = true;
            if(!isPreview) {
                statusOverlay.classList.remove('-translate-y-20');
                startRecording();
            }

            clearCanvas();
            initAudio();
            
            // Setup Styles
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = currentPen.color;
            
            // Pen width logic
            if (currentPen.type === 'marker') ctx.lineWidth = 8;
            else if (currentPen.type === 'chalk') ctx.lineWidth = 4;
            else ctx.lineWidth = 2.5;

            // Prepare Signature
            const sigText = signatureInput.value.trim();
            if (sigText) {
                // Normally we'd convert text to path. 
                // Hack: We'll draw it at the end using canvas text API but animate it loosely
            }

            let pathIdx = 0;
            let currentLen = 0;
            const globalSpeed = parseFloat(speedInput.value);

            // Buffer for drawing history (so we don't clear previous paths)
            // To optimize, we draw directly to canvas.
            
            let lastX = 0;
            let lastY = 0;

            const startTime = Date.now();

            function loop() {
                if (pathIdx >= paths.length) {
                    finishDrawing(isPreview, startTime);
                    return;
                }

                const p = paths[pathIdx];
                
                // Determine step size based on speed
                // Base speed: 3 pixels per frame * multiplier
                const step = 4 * globalSpeed; 
                
                // ASMR Sound Modulation
                // If we are moving, play sound
                if (currentLen === 0) startPenSound();
                updatePenSound(globalSpeed);

                // Draw segment
                ctx.beginPath();
                
                // We need to stroke from previous point to current point
                // Optimization: getPointAtLength is expensive. 
                const pt1 = p.element.getPointAtLength(currentLen);
                const x1 = pt1.x * p.scale + p.offsetX;
                const y1 = pt1.y * p.scale + p.offsetY;

                if (currentLen === 0) {
                    lastX = x1;
                    lastY = y1;
                }

                currentLen += step;
                if (currentLen > p.length) currentLen = p.length;

                const pt2 = p.element.getPointAtLength(currentLen);
                const x2 = pt2.x * p.scale + p.offsetX;
                const y2 = pt2.y * p.scale + p.offsetY;

                // Draw the ink
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x2, y2);
                
                // Chalk effect needs roughness
                if (currentPen.type === 'chalk') {
                    ctx.shadowBlur = 2;
                    ctx.shadowColor = currentPen.color;
                    if(Math.random() > 0.3) ctx.stroke(); // Skip pixels for chalky look
                } else {
                    ctx.shadowBlur = 0;
                    ctx.stroke();
                }

                lastX = x2;
                lastY = y2;

                // We must restore the canvas image to draw the pen cursor on top without baking it in
                // Standard canvas animation trick:
                // Since this is a drawing app, we actually WANT to bake the line in.
                // But we need to clear the area where the pen was drawn previously? 
                // No, simpler: Get ImageData of whole canvas, Draw Pen, Put ImageData back? Too slow for 60fps at 1080p.
                
                // Better approach: Use layer. 
                // Since we are single file, let's just accept the pen flickers slightly or use a second canvas overlay?
                // NO, we need to record ONE stream.
                
                // Correct Loop Logic:
                // 1. We draw the permanent line on the MAIN canvas.
                // 2. But wait, if we draw the pen, it becomes permanent.
                // 3. Solution: The recorder needs to record the composition.
                
                // REFACTOR FOR ANIMATION LOOP:
                // We need `ctx` to hold the drawing.
                // We need a temporary variable to hold the Pen position to draw it ON TOP of the frame sent to recorder, 
                // but strictly speaking `canvas.captureStream` grabs the presentation layer.
                
                // To do this right without layers:
                // We have to redraw the whole scene? No, too many paths.
                // We MUST use a second canvas for the cursor or accept drawing complexity.
                
                // Let's use the `getImageData` trick but only for the small rect around the pen?
                // Actually, simplest VanillaJS solution:
                // Two Canvases overlaid. 
                // Bottom: Drawing. Top: Cursor.
                // Recorder: Draw Bottom to Offscreen, Draw Top to Offscreen, Stream Offscreen.
                // This guarantees 60fps.
                
                // Implementing "One Canvas" constraint for simplicity/performance in single file:
                // We will skip the cursor clearing issue by simply NOT drawing the cursor into the persistent context,
                // but that's impossible with one canvas.
                
                // OK, I will add a cursor layer dynamically.
                
                if (currentLen >= p.length) {
                    stopPenSound();
                    pathIdx++;
                    currentLen = 0;
                    // Small pause between strokes for realism
                    animationId = setTimeout(loop, 100 / globalSpeed); // 100ms pause
                } else {
                    animationId = requestAnimationFrame(loop);
                }
                
                // Update Timer
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const secs = (elapsed % 60).toString().padStart(2, '0');
                timerDisplay.innerText = `${mins}:${secs}`;
            }

            // START THE CURSOR ANIMATION LOOP SEPARATELY?
            // No, strictly synchronized.
            
            // To solve the "Pen Cursor" problem on a single canvas without erasing the drawing:
            // I will inject a secondary canvas for the Cursor on top of the DOM.
            // AND I will use a hidden `combinedCanvas` for the MediaRecorder that draws both every frame.
            
            // Adjusting strategy for robust Recording:
            loop();
        }

        // --- OVERLAY CANVAS STRATEGY FOR CURSOR ---
        // We need a cursor canvas to show the user the pen without smearing ink.
        // We need a hidden canvas to mix them for the video.
        
        const cursorCanvas = document.createElement('canvas');
        cursorCanvas.width = CANVAS_WIDTH;
        cursorCanvas.height = CANVAS_HEIGHT;
        cursorCanvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none';
        canvas.parentElement.appendChild(cursorCanvas);
        const cCtx = cursorCanvas.getContext('2d');

        // Overwrite the drawing loop to handle the separation
        // Real implementation of animateDrawing with Cursor Separation
        
        async function animateDrawingCorrected(isPreview) {
            if (isDrawing) return;
            isDrawing = true;
            
            startBtn.disabled = true;
            fileInput.disabled = true;
            if(!isPreview) {
                statusOverlay.classList.remove('-translate-y-20');
                startRecording();
            }

            clearCanvas(); // Clear Ink Canvas
            cCtx.clearRect(0,0, CANVAS_WIDTH, CANVAS_HEIGHT); // Clear Cursor Canvas
            initAudio();

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = currentPen.color;
            if (currentPen.type === 'marker') ctx.lineWidth = 8;
            else if (currentPen.type === 'chalk') ctx.lineWidth = 4;
            else ctx.lineWidth = 2.5;

            let pathIdx = 0;
            let currentLen = 0;
            const globalSpeed = parseFloat(speedInput.value);
            const startTime = Date.now();

            // Recording Mixer Canvas (Hidden)
            const mixerCanvas = document.createElement('canvas');
            mixerCanvas.width = CANVAS_WIDTH;
            mixerCanvas.height = CANVAS_HEIGHT;
            const mCtx = mixerCanvas.getContext('2d');
            
            // If recording, we need to manually pump frames to the MediaStream
            // Actually, we can capture the Ink Canvas stream, but we miss the cursor.
            // We must draw to mixer.

            function drawFrame() {
                if (pathIdx >= paths.length) {
                    finishDrawing(isPreview, startTime);
                    return;
                }

                const p = paths[pathIdx];
                const step = 5 * globalSpeed; 

                // 1. Audio
                if (currentLen === 0) startPenSound();
                updatePenSound(globalSpeed);

                // 2. Logic: Where is the pen?
                const pt = p.element.getPointAtLength(currentLen);
                const x = pt.x * p.scale + p.offsetX;
                const y = pt.y * p.scale + p.offsetY;

                // 3. Draw Ink on Main Canvas (Permanent)
                // We need the previous point
                const prevLen = Math.max(0, currentLen - step);
                const prevPt = p.element.getPointAtLength(prevLen);
                const prevX = prevPt.x * p.scale + p.offsetX;
                const prevY = prevPt.y * p.scale + p.offsetY;

                if (currentLen > 0) {
                    ctx.beginPath();
                    ctx.moveTo(prevX, prevY);
                    ctx.lineTo(x, y);
                     if (currentPen.type === 'chalk') {
                        ctx.shadowBlur = 2; ctx.shadowColor = currentPen.color;
                        if(Math.random() > 0.3) ctx.stroke();
                    } else {
                        ctx.stroke();
                    }
                }

                // 4. Draw Cursor on Overlay Canvas (Temporary)
                cCtx.clearRect(0,0, CANVAS_WIDTH, CANVAS_HEIGHT);
                
                // Draw Signature if last path
                // (Simplified: Signature is just another path in a real app)

                // Draw Pen
                cCtx.save();
                cCtx.translate(x, y);
                const wobble = Math.sin(Date.now() / 150) * 0.05;
                cCtx.rotate(0.5 + wobble); 
                
                // Pen Shadow
                cCtx.shadowColor = "rgba(0,0,0,0.3)";
                cCtx.shadowBlur = 10;
                cCtx.shadowOffsetX = 10; cCtx.shadowOffsetY = 15;
                
                // Pen Body
                const grad = cCtx.createLinearGradient(0,0, 20, -100);
                grad.addColorStop(0, '#222'); grad.addColorStop(0.5, '#555'); grad.addColorStop(1, '#222');
                cCtx.fillStyle = grad;
                cCtx.beginPath();
                cCtx.moveTo(0, 0); cCtx.lineTo(15, -15); cCtx.lineTo(20, -200); cCtx.lineTo(-5, -200); cCtx.lineTo(-10, -15);
                cCtx.closePath();
                cCtx.fill();
                cCtx.restore();

                // 5. If Recording, Mix to Hidden Canvas
                if (isRecording && mCtx) {
                    mCtx.drawImage(canvas, 0, 0); // Ink
                    mCtx.drawImage(cursorCanvas, 0, 0); // Cursor
                    // We need to manually tell the stream track to request a frame if we were using a manual generator,
                    // but canvas.captureStream(60) handles it automatically if we draw to the canvas source of the stream.
                    // Wait, `canvas.captureStream` captures the SOURCE canvas.
                    // So we should record `mixerCanvas`.
                }

                // Advance
                currentLen += step;
                if (currentLen >= p.length) {
                    currentLen = p.length; // Ensure end is drawn
                    // Draw last segment
                    stopPenSound();
                    pathIdx++;
                    currentLen = 0;
                    // Pause between strokes
                    setTimeout(() => requestAnimationFrame(drawFrame), 150 / globalSpeed);
                } else {
                    requestAnimationFrame(drawFrame);
                }

                // Update Timer UI
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                timerDisplay.innerText = new Date(elapsed * 1000).toISOString().substr(14, 5);
            }

            // Setup Mixer for Recording
            if(!isPreview) {
                // We redefine the startRecording logic to use the mixerCanvas
                // This is a bit tricky inside the function, but essential.
                // We'll expose mixerCanvas to the outer scope or re-init recorder here.
                
                const stream = mixerCanvas.captureStream(60); // 60 FPS
                // Mix Audio
                const combinedStream = new MediaStream([
                    ...stream.getVideoTracks(),
                    ...destNode.stream.getAudioTracks()
                ]);
                
                startMediaRecorder(combinedStream);
            }

            drawFrame();
        }

        function finishDrawing(isPreview, startTime) {
            isDrawing = false;
            stopPenSound();
            cCtx.clearRect(0,0, CANVAS_WIDTH, CANVAS_HEIGHT); // Remove pen
            
            // Draw Signature
            const sig = signatureInput.value;
            if(sig) {
                ctx.font = "100px 'Dancing Script'";
                ctx.fillStyle = currentPen.color;
                ctx.fillText(sig, CANVAS_WIDTH - 400, CANVAS_HEIGHT - 100);
            }

            if (!isPreview) {
                statusText.innerText = "Finalizing...";
                setTimeout(() => {
                    stopRecording();
                    statusOverlay.classList.add('-translate-y-20');
                    document.getElementById('downloadOverlay').classList.remove('hidden');
                    startBtn.disabled = false;
                    fileInput.disabled = false;
                }, 1000); // Record a second of silence/stillness at the end
            } else {
                startBtn.disabled = false;
                fileInput.disabled = false;
            }
        }

        // --- RECORDING LOGIC ---

        function startMediaRecorder(stream) {
            recordedChunks = [];
            
            // Try to find best mime type
            const types = [
                "video/mp4;codecs=avc1.42E01E,mp4a.40.2", // Safari / Modern Chrome
                "video/webm;codecs=h264", // Chrome with h264
                "video/webm;codecs=vp9", // Chrome High Quality
                "video/webm" // Fallback
            ];
            
            let options = { mimeType: "" };
            for (let t of types) {
                if (MediaRecorder.isTypeSupported(t)) {
                    options.mimeType = t;
                    break;
                }
            }

            console.log("Recording with:", options.mimeType);

            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                console.error("MediaRecorder error:", e);
                mediaRecorder = new MediaRecorder(stream); // Default
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.start();
            isRecording = true;
        }

        function startRecording() {
            // Placeholder, actual logic moved to animateDrawingCorrected for Canvas mixing
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                isRecording = false;
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
                    const url = URL.createObjectURL(blob);
                    const a = document.getElementById('downloadLink');
                    
                    // Determine extension
                    let ext = "webm";
                    if (mediaRecorder.mimeType.includes("mp4")) ext = "mp4";
                    
                    const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                    a.href = url;
                    a.download = `asmr_drawing_${timestamp}.${ext}`;
                };
            }
        }

        // --- UI HANDLERS ---
        
        speedInput.addEventListener('input', (e) => {
            speedVal.innerText = e.target.value + 'x';
        });

        inkColorInput.addEventListener('input', (e) => {
            currentPen.color = e.target.value;
        });

        function setPenType(type) {
            currentPen.type = type;
            document.querySelectorAll('.pen-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'border-blue-500', 'active');
                b.classList.add('bg-gray-700', 'border-gray-600');
            });
            event.target.classList.remove('bg-gray-700', 'border-gray-600');
            event.target.classList.add('bg-blue-600', 'border-blue-500', 'active');
        }

        function setPaper(type) {
            canvas.className = `w-full h-auto block paper-texture-${type} transition-colors duration-500`;
        }

        startBtn.addEventListener('click', () => {
            if(paths.length === 0) { alert("Please upload an SVG first!"); return; }
            animateDrawingCorrected(false);
        });

        previewBtn.addEventListener('click', () => {
            if(paths.length === 0) { alert("Please upload an SVG first!"); return; }
            animateDrawingCorrected(true);
        });

    </script>
</body>
