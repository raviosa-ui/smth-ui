<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube Interactive Chapter Formatter — SocialMediaToolsHub</title>
  <meta name="description" content="Generate YouTube chapters and timestamps instantly from your transcript. Free interactive tool for creators to improve video SEO and navigation." />
  <meta name="theme-color" content="#0f172a" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0f172a',
            card: '#1e293b',
            text: '#f8fafc',
            muted: '#94a3b8',
            border: '#334155',
            accentFrom: '#38bdf8',
            accentTo: '#818cf8',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom scrollbar for dark theme */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a; 
    }
    ::-webkit-scrollbar-thumb {
      background: #334155; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569; 
    }
    .selection-highlight::selection {
      background: rgba(56, 189, 248, 0.3);
      color: white;
    }
    /* Simple fade/zoom animation classes if not using Tailwind plugins */
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-popup { animation: fadeIn 0.2s ease-out forwards; }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
</head>
<body class="bg-bg text-text antialiased selection:bg-accentFrom selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Utils ---
    const parseTimestampToSeconds = (timestamp) => {
      const parts = timestamp.split(':').map(Number);
      if (parts.some(isNaN)) return 0;
      
      if (parts.length === 3) {
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
      } else if (parts.length === 2) {
        return parts[0] * 60 + parts[1];
      } else {
        return parts[0] || 0;
      }
    };

    const formatSecondsToTimestamp = (totalSeconds) => {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = Math.floor(totalSeconds % 60);

      const mStr = m.toString().padStart(2, '0');
      const sStr = s.toString().padStart(2, '0');

      if (h > 0) {
        return `${h}:${mStr}:${sStr}`;
      }
      return `${mStr}:${sStr}`;
    };

    const generateId = () => Math.random().toString(36).substring(2, 9);

    // --- Icons (Inlined for single file portability) ---
    const Icon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Copy = (p) => <Icon {...p}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></Icon>;
    const Plus = (p) => <Icon {...p}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;
    const Trash2 = (p) => <Icon {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>;
    const AlertCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></Icon>;
    const CheckCircle2 = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>;
    const Youtube = (p) => <Icon {...p}><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></Icon>;
    const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
    const FileText = (p) => <Icon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></Icon>;

    // --- Main Component ---
    const App = () => {
      // --- State ---
      const [transcript, setTranscript] = useState('');
      const [chapters, setChapters] = useState([]);
      const [selection, setSelection] = useState(null);
      const [tempTimestamp, setTempTimestamp] = useState('');
      const [copyStatus, setCopyStatus] = useState('idle');
      
      const textareaRef = useRef(null);

      // --- Initial Chapter ---
      useEffect(() => {
        if (chapters.length === 0) {
          setChapters([{
            id: generateId(),
            timestamp: '00:00',
            title: 'Introduction',
            seconds: 0
          }]);
        }
      }, []);

      // --- Handlers ---
      const handleTextSelect = () => {
        const textarea = textareaRef.current;
        if (!textarea) return;

        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;

        if (start !== end) {
          const selectedText = textarea.value.substring(start, end);
          if (selectedText.trim().length > 0) {
            setSelection({
              text: selectedText.trim(),
              top: 0,
              left: 0
            });
            setTempTimestamp(''); 
          }
        }
      };

      const addChapter = () => {
        if (!selection) return;
        
        let finalTimestamp = tempTimestamp.trim();
        if (!finalTimestamp.includes(':')) {
            if(!isNaN(Number(finalTimestamp)) && finalTimestamp !== "") {
               finalTimestamp = formatSecondsToTimestamp(Number(finalTimestamp)); 
            } else {
               finalTimestamp = "00:00"; 
            }
        }

        const seconds = parseTimestampToSeconds(finalTimestamp);
        
        const newChapter = {
          id: generateId(),
          timestamp: finalTimestamp,
          title: selection.text,
          seconds: seconds
        };

        setChapters(prev => {
            const updated = [...prev, newChapter];
            return updated.sort((a, b) => a.seconds - b.seconds);
        });
        
        setSelection(null);
        if (textareaRef.current) {
            textareaRef.current.blur();
        }
      };

      const removeChapter = (id) => {
        setChapters(prev => prev.filter(c => c.id !== id));
      };

      const updateChapter = (id, field, value) => {
        setChapters(prev => {
          const updated = prev.map(c => {
            if (c.id === id) {
              const updates = { [field]: value };
              if (field === 'timestamp') {
                updates.seconds = parseTimestampToSeconds(value);
              }
              return { ...c, ...updates };
            }
            return c;
          });
          if (field === 'timestamp') {
            return updated.sort((a, b) => a.seconds - b.seconds);
          }
          return updated;
        });
      };

      const copyToClipboard = () => {
        const text = chapters.map(c => `${c.timestamp} - ${c.title}`).join('\n');
        navigator.clipboard.writeText(text).then(() => {
          setCopyStatus('success');
          setTimeout(() => setCopyStatus('idle'), 2000);
        }).catch(() => {
          setCopyStatus('error');
        });
      };

      const clearSelection = () => {
        setSelection(null);
      };

      // --- Data ---
      const faqs = [
        { question: "Why do I need YouTube chapters?", answer: "Chapters break up long videos, helping viewers navigate to specific sections. They also appear in Google Search, improving your video's SEO visibility." },
        { question: "Does this tool upload my transcript?", answer: "No. This tool runs entirely in your browser (client-side). Your text and data never leave your device." },
        { question: "What is the correct format for YouTube chapters?", answer: "The first chapter must start at 00:00. Timestamps should be in MM:SS or HH:MM:SS format, followed by a space, a hyphen, and the chapter title." },
        { question: "Can I use this for YouTube Shorts?", answer: "YouTube Shorts generally don't display chapters in the progress bar like long-form videos, but adding timestamps in the description is still clickable." },
        { question: "Why isn't my first chapter showing up?", answer: "YouTube requires the first timestamp to be exactly 0:00 or 00:00. This tool automatically checks for that." },
        { question: "Is there a limit to how many chapters I can have?", answer: "YouTube requires at least 3 timestamps listed in ascending order, and each chapter must be at least 10 seconds long." },
        { question: "Can I edit the chapters after adding them?", answer: "Yes, you can edit both the timestamp and the title directly in the list on the right side of the tool." },
        { question: "Do I need to sign in?", answer: "No, this tool is completely free and requires no account or login." },
        { question: "Will this work on mobile?", answer: "Yes, the layout is responsive, though selecting specific text for chapters is often easier on a desktop." },
        { question: "How do I clear the data?", answer: "Simply refresh the page to clear all data. Since we don't store data, nothing persists." },
      ];

      return (
        <div className="container mx-auto pb-8 px-5 max-w-[1120px]">
          
          {/* Header */}
          <header className="flex items-center justify-between py-4 gap-3">
            <div className="flex gap-2.5 font-semibold text-lg whitespace-nowrap items-center">
              <span className="text-2xl">⚡</span>
              <span className="bg-gradient-to-r from-accentFrom to-accentTo bg-clip-text text-transparent">
                SocialMediaToolsHub
              </span>
            </div>
            <nav className="flex gap-2.5 text-sm flex-wrap" aria-label="Primary">
              <a href="#tool" className="px-2.5 py-2 rounded-[10px] text-muted hover:text-text hover:bg-white/5 transition-colors">Tool</a>
              <a href="#faq" className="px-2.5 py-2 rounded-[10px] text-muted hover:text-text hover:bg-white/5 transition-colors">FAQs</a>
            </nav>
          </header>

          {/* Hero */}
          <main>
            <section className="bg-card rounded-[24px] p-5 mt-4 shadow-[0_6px_22px_rgba(3,7,18,0.6)] border border-white/5 flex flex-col md:flex-row items-center md:items-start text-center md:text-left gap-5">
              <div className="flex-1">
                <h1 className="text-xl md:text-2xl font-bold mb-2">YouTube Interactive Chapter Formatter</h1>
                <p className="text-muted text-[15px] leading-relaxed">
                  Create SEO-friendly video timestamps from your transcript instantly. 
                  Highlight text to create chapters, assign times, and export perfectly formatted lists for your description.
                </p>
              </div>
              <div className="flex flex-col items-center justify-end gap-3 min-w-[200px]">
                <div className="flex items-center gap-2 text-xs text-muted font-medium bg-bg/50 px-3 py-1 rounded-full border border-border">
                    <Clock size={14} className="text-accentFrom" />
                    <span>Client-Side Only</span>
                </div>
                <div className="flex items-center gap-2 text-xs text-muted font-medium bg-bg/50 px-3 py-1 rounded-full border border-border">
                    <Youtube size={14} className="text-red-400" />
                    <span>YouTube Ready</span>
                </div>
              </div>
            </section>

            {/* Tool Section */}
            <section id="tool" className="mt-6 grid lg:grid-cols-2 gap-6">
                
                {/* Left Column: Input & Interaction */}
                <div className="flex flex-col gap-4">
                    <div className="flex items-center justify-between">
                        <h2 className="text-base font-semibold flex items-center gap-2">
                            <FileText size={18} className="text-accentFrom" />
                            1. Paste Transcript & Highlight Text
                        </h2>
                        <span className="text-xs text-muted hidden sm:block">Select text to create a chapter title</span>
                    </div>
                    
                    <div className="relative group">
                        <textarea
                            ref={textareaRef}
                            className="w-full h-[500px] bg-card border border-border rounded-[16px] p-4 text-sm text-muted focus:text-text focus:outline-none focus:border-accentFrom transition-colors resize-none leading-relaxed selection-highlight"
                            placeholder="Paste your video transcript or notes here...&#10;&#10;Then highlight any phrase (like 'Introduction' or 'Key Takeaway') to turn it into a chapter."
                            value={transcript}
                            onChange={(e) => setTranscript(e.target.value)}
                            onMouseUp={handleTextSelect}
                            onTouchEnd={handleTextSelect}
                        ></textarea>

                        {/* Interaction Modal / Popover */}
                        {selection && (
                            <div className="absolute top-4 left-4 right-4 md:left-auto md:right-4 md:w-80 bg-[#0f172a] border border-accentFrom shadow-2xl rounded-xl p-4 z-10 animate-popup">
                                 <div className="flex justify-between items-start mb-3">
                                    <h3 className="text-sm font-semibold text-white">New Chapter</h3>
                                    <button onClick={clearSelection} className="text-muted hover:text-white"><span className="sr-only">Close</span>✕</button>
                                 </div>
                                 
                                 <div className="mb-3">
                                    <label className="block text-xs text-muted mb-1">Chapter Title</label>
                                    <div className="text-sm text-accentFrom font-medium truncate bg-white/5 p-2 rounded border border-white/10">
                                        "{selection.text}"
                                    </div>
                                 </div>

                                 <div className="mb-4">
                                    <label className="block text-xs text-muted mb-1">Timestamp (MM:SS)</label>
                                    <input 
                                        type="text" 
                                        autoFocus
                                        placeholder="e.g. 01:45"
                                        className="w-full bg-bg border border-border rounded p-2 text-white text-sm focus:border-accentFrom outline-none"
                                        value={tempTimestamp}
                                        onChange={(e) => setTempTimestamp(e.target.value)}
                                        onKeyDown={(e) => {
                                            if(e.key === 'Enter') addChapter();
                                            if(e.key === 'Escape') clearSelection();
                                        }}
                                    />
                                 </div>

                                 <button 
                                    onClick={addChapter}
                                    className="w-full py-2 bg-gradient-to-r from-accentFrom to-accentTo text-[#06121f] font-bold rounded-lg text-sm hover:shadow-lg hover:shadow-sky-500/20 transition-all active:scale-95 flex items-center justify-center gap-2"
                                 >
                                    <Plus size={16} />
                                    Add Chapter
                                 </button>
                            </div>
                        )}
                    </div>
                </div>

                {/* Right Column: List & Export */}
                <div className="flex flex-col gap-4">
                    <div className="flex items-center justify-between">
                         <h2 className="text-base font-semibold flex items-center gap-2">
                            <Youtube size={18} className="text-red-400" />
                            2. Edit & Export
                        </h2>
                        <button 
                            onClick={() => setChapters([{ id: generateId(), timestamp: '00:00', title: 'Introduction', seconds: 0 }])}
                            className="text-xs text-muted hover:text-red-400 transition-colors"
                        >
                            Reset
                        </button>
                    </div>

                    <div className="bg-card border border-border rounded-[16px] flex flex-col h-[500px]">
                        
                        {/* Chapter List Area */}
                        <div className="flex-1 overflow-y-auto p-2 space-y-2">
                            {chapters.length === 0 && (
                                <div className="h-full flex flex-col items-center justify-center text-muted text-sm opacity-60">
                                    <AlertCircle size={32} className="mb-2" />
                                    <p>No chapters yet.</p>
                                </div>
                            )}
                            
                            {chapters.map((chapter, index) => (
                                <div key={chapter.id} className="group flex items-center gap-3 bg-white/5 border border-white/5 hover:border-white/10 p-3 rounded-lg transition-all">
                                    <span className="text-xs text-muted font-mono w-6 text-center">{index + 1}</span>
                                    
                                    <input 
                                        type="text" 
                                        value={chapter.timestamp}
                                        onChange={(e) => updateChapter(chapter.id, 'timestamp', e.target.value)}
                                        className="w-16 bg-bg border border-border rounded px-2 py-1 text-sm text-accentFrom font-mono focus:border-accentTo outline-none text-center"
                                    />
                                    
                                    <input 
                                        type="text" 
                                        value={chapter.title}
                                        onChange={(e) => updateChapter(chapter.id, 'title', e.target.value)}
                                        className="flex-1 bg-transparent border-none text-sm text-text focus:bg-bg/50 rounded px-2 py-1 outline-none"
                                    />

                                    <button 
                                        onClick={() => removeChapter(chapter.id)}
                                        className="text-muted hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1"
                                        title="Remove chapter"
                                    >
                                        <Trash2 size={14} />
                                    </button>
                                </div>
                            ))}
                        </div>

                        {/* Output / Preview Area */}
                        <div className="border-t border-border p-4 bg-bg/50 rounded-b-[16px]">
                            <div className="flex justify-between items-end mb-2">
                                <label className="text-xs font-bold text-muted uppercase tracking-wider">Preview Output</label>
                                {copyStatus === 'success' && <span className="text-xs text-green-400 flex items-center gap-1"><CheckCircle2 size={12}/> Copied!</span>}
                            </div>
                            
                            <div className="bg-[#0b1120] rounded-lg p-3 text-xs font-mono text-muted mb-4 max-h-32 overflow-y-auto whitespace-pre-wrap select-all">
                                {chapters.map(c => `${c.timestamp} - ${c.title}`).join('\n')}
                            </div>

                            <button 
                                onClick={copyToClipboard}
                                className="w-full py-3 bg-gradient-to-r from-accentFrom to-accentTo text-[#06121f] font-bold rounded-xl text-sm hover:-translate-y-1 hover:shadow-lg hover:shadow-sky-500/20 transition-all flex items-center justify-center gap-2"
                            >
                                <Copy size={16} />
                                Copy Format to Clipboard
                            </button>
                        </div>
                    </div>
                </div>

            </section>

            {/* How to Use Section */}
            <section className="mt-8 bg-[#162032] border border-dashed border-border/60 rounded-[20px] p-6 md:p-8 relative overflow-hidden">
                 {/* Decorative background element */}
                 <div className="absolute top-0 right-0 p-32 bg-accentFrom/5 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>

                <h3 className="text-lg font-bold mb-8 text-center text-white relative z-10">How to use this tool</h3>
                
                <div className="grid md:grid-cols-3 gap-8 relative z-10">
                    {/* Step 1 */}
                    <div className="flex flex-col items-center text-center group">
                        <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-card to-bg border border-border flex items-center justify-center text-accentFrom mb-4 shadow-lg shadow-black/20 group-hover:-translate-y-1 transition-transform duration-300">
                            <FileText size={24} />
                        </div>
                        <h4 className="font-semibold text-text mb-2">1. Paste & Highlight</h4>
                        <p className="text-sm text-muted leading-relaxed">
                            Paste your transcript into the editor. Select any text (like a title) to trigger the chapter creator.
                        </p>
                    </div>

                    {/* Step 2 */}
                    <div className="flex flex-col items-center text-center group">
                        <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-card to-bg border border-border flex items-center justify-center text-accentFrom mb-4 shadow-lg shadow-black/20 group-hover:-translate-y-1 transition-transform duration-300">
                            <Clock size={24} />
                        </div>
                        <h4 className="font-semibold text-text mb-2">2. Assign Timestamp</h4>
                        <p className="text-sm text-muted leading-relaxed">
                            A popup will appear. Enter the timestamp for that moment and click "Add Chapter".
                        </p>
                    </div>

                    {/* Step 3 */}
                    <div className="flex flex-col items-center text-center group">
                        <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-card to-bg border border-border flex items-center justify-center text-accentFrom mb-4 shadow-lg shadow-black/20 group-hover:-translate-y-1 transition-transform duration-300">
                            <Youtube size={24} />
                        </div>
                        <h4 className="font-semibold text-text mb-2">3. Export to YouTube</h4>
                        <p className="text-sm text-muted leading-relaxed">
                            Review your list, click "Copy Format", and paste it directly into your video description.
                        </p>
                    </div>
                </div>
            </section>

            {/* FAQ Section */}
            <section id="faq" className="max-w-[800px] mx-auto mt-16 mb-8">
                <h3 className="text-xl font-bold mb-6 text-center">Frequently Asked Questions</h3>
                <div className="space-y-4">
                    {faqs.map((faq, idx) => (
                        <details key={idx} className="group bg-card border border-border rounded-[16px] open:border-accentFrom/50 transition-colors">
                            <summary className="flex cursor-pointer list-none items-center justify-between p-5 font-medium text-text">
                                {faq.question}
                                <span className="transition group-open:rotate-180">
                                    <svg fill="none" height="24" shapeRendering="geometricPrecision" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" viewBox="0 0 24 24" width="24"><path d="M6 9l6 6 6-6"></path></svg>
                                </span>
                            </summary>
                            <div className="px-5 pb-5 text-sm text-muted leading-relaxed">
                                {faq.answer}
                            </div>
                        </details>
                    ))}
                </div>
            </section>

          </main>

          {/* Footer */}
          <footer className="text-center text-muted text-xs mt-12 pt-8 border-t border-white/5">
            © 2025 SocialMediaToolsHub. Built for speed.
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
