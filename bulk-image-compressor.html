<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bulk Image Compressor | SocialMediaToolsHub</title>
<meta name="description" content="Batch compress JPG, PNG, and WebP images instantly in your browser. No uploads, no tracking.">
<link rel="canonical" href="https://socialmediatoolshub.com/bulk-image-compressor">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
:root {
  --bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;
  --border:#334155;--accent:#38bdf8;--accent2:#818cf8;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
.container{max-width:1100px;margin:auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:20px;text-decoration:none;color:white}
.hero{background:var(--card);padding:25px;border-radius:20px;margin:20px 0}
.dropzone{border:2px dashed var(--border);padding:60px 20px;border-radius:20px;text-align:center;cursor:pointer}
.processing-container{margin-top:30px;background:var(--card);border-radius:16px;overflow:hidden}
.processing-header{padding:20px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.file-row{padding:20px;border-bottom:1px solid var(--border)}
.file-main{display:flex;justify-content:space-between;gap:15px}
.file-name{font-weight:700;font-size:14px}
.file-size{font-size:12px;color:var(--muted)}
.settings-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-top:15px}
.label{font-size:11px;color:var(--muted);font-weight:700}
select,input[type=range]{background:var(--bg);color:white;border:1px solid var(--border);padding:6px;border-radius:6px}
.btn{padding:10px 16px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.btn-success{background:#10b981;color:white}
.btn-danger{background:none;color:#ef4444}
.progress-bg{height:6px;background:#0003;border-radius:3px;margin-top:10px}
.progress-fill{height:100%;background:var(--accent)}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useMemo,useRef} = React;

const formatSize = b =>
  b ? (b<1024?`${b} B`:(b<1048576?`${(b/1024).toFixed(2)} KB`:`${(b/1048576).toFixed(2)} MB`)) : "0 B";

const App = () => {
  const [files,setFiles] = useState([]);
  const [isProcessing,setIsProcessing] = useState(false);
  const fileInputRef = useRef();

  const updateFile = (id, updates) => {
    setFiles(prev => prev.map(f => f.id===id ? {...f,...updates} : f));
  };

  const addFiles = (list) => {
    const mapped = Array.from(list)
      .filter(f=>f.type.startsWith("image/"))
      .map(file=>({
        id:crypto.randomUUID(),
        file,
        name:file.name,
        originalSize:file.size,
        compressedSize:null,
        compressedBlob:null,
        status:"pending",
        progress:0,
        quality:80,
        format:"image/jpeg",
        targetSizeKb:"auto"
      }));
    setFiles(prev=>[...prev,...mapped]);
  };

  const compressSingle = async (item) => {
    updateFile(item.id,{status:"processing",progress:0});
    try{
      const options={
        initialQuality:item.quality/100,
        maxSizeMB:item.targetSizeKb==="auto"?undefined:item.targetSizeKb/1024,
        fileType:item.format,
        useWebWorker:true,
        onProgress:p=>updateFile(item.id,{progress:p})
      };
      const out = await imageCompression(item.file,options);
      updateFile(item.id,{
        status:"completed",
        progress:100,
        compressedBlob:out,
        compressedSize:out.size
      });
    }catch{
      updateFile(item.id,{status:"error"});
    }
  };

  const compressAll = async () => {
    if(!files.length) return;
    setIsProcessing(true);
    for(const f of files){
      if(f.status!=="completed") await compressSingle(f);
    }
    setIsProcessing(false);
  };

  const downloadZip = async () => {
    const zip = new JSZip();
    const done = files.filter(f=>f.status==="completed" && f.compressedBlob);
    if(!done.length) return alert("No completed files.");
    done.forEach(f=>{
      const ext = f.format.split("/")[1]||"jpg";
      const base = f.name.replace(/\.[^/.]+$/,"");
      zip.file(`smth-${base}.${ext}`,f.compressedBlob);
    });
    const blob = await zip.generateAsync({type:"blob"});
    const url = URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="socialmediatoolshub-images.zip";a.click();
    URL.revokeObjectURL(url);
  };

  const hasCompleted = files.some(f=>f.status==="completed");

  return (
    <div className="container">
      <div className="header">
        <a className="brand" href="/">⚡ SocialMediaToolsHub</a>
      </div>

      <div className="hero">
        <h1>Bulk Image Compressor</h1>
        <p style={{color:"var(--muted)"}}>100% browser-based. No uploads.</p>
      </div>

      <div className="dropzone"
        onClick={()=>fileInputRef.current.click()}
        onDragOver={e=>e.preventDefault()}
        onDrop={e=>{e.preventDefault();addFiles(e.dataTransfer.files);}}>
        <input ref={fileInputRef} hidden type="file" multiple accept="image/*"
          onChange={e=>addFiles(e.target.files)} />
        <h2>Drop images or click to browse</h2>
      </div>

      {!!files.length && (
        <div className="processing-container">
          <div className="processing-header">
            <strong>{files.length} files</strong>
            <div style={{display:"flex",gap:"10px"}}>
              <button className="btn" onClick={()=>setFiles([])}>Clear</button>
              <button className="btn btn-primary" disabled={isProcessing} onClick={compressAll}>
                {isProcessing?"Processing…":"Compress All"}
              </button>
              {hasCompleted && !isProcessing && (
                <button className="btn btn-success" onClick={downloadZip}>
                  Download ZIP
                </button>
              )}
            </div>
          </div>

          {files.map(f=>(
            <div className="file-row" key={f.id}>
              <div className="file-main">
                <div>
                  <div className="file-name">{f.name}</div>
                  <div className="file-size">
                    {formatSize(f.originalSize)}
                    {f.compressedSize && ` → ${formatSize(f.compressedSize)}`}
                  </div>
                </div>
                <div style={{display:"flex",gap:"10px"}}>
                  {f.status==="completed" && (
                    <button className="btn btn-success" onClick={()=>{
                      const url=URL.createObjectURL(f.compressedBlob);
                      const a=document.createElement("a");
                      const ext=f.format.split("/")[1]||"jpg";
                      a.href=url;
                      a.download=`smth-${f.name.replace(/\.[^/.]+$/,"")}.${ext}`;
                      a.click();
                      URL.revokeObjectURL(url);
                    }}>Download</button>
                  )}
                  <button className="btn-danger" onClick={()=>setFiles(p=>p.filter(x=>x.id!==f.id))}>✕</button>
                </div>
              </div>

              <div className="settings-bar">
                <div>
                  <div className="label">Format</div>
                  <select value={f.format}
                    onChange={e=>updateFile(f.id,{format:e.target.value,status:"pending",compressedBlob:null,compressedSize:null})}>
                    <option value="image/jpeg">JPEG</option>
                    <option value="image/png">PNG</option>
                    <option value="image/webp">WebP</option>
                  </select>
                </div>
                <div>
                  <div className="label">Quality ({f.quality}%)</div>
                  <input type="range" min="1" max="100" value={f.quality}
                    onChange={e=>updateFile(f.id,{quality:+e.target.value,targetSizeKb:"auto",status:"pending",compressedBlob:null,compressedSize:null})}/>
                </div>
                <button className="btn btn-primary"
                  disabled={f.status==="processing"}
                  onClick={()=>compressSingle(f)}>
                  Go
                </button>
              </div>

              {f.status==="processing" && (
                <div className="progress-bg">
                  <div className="progress-fill" style={{width:`${f.progress}%`}}></div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
