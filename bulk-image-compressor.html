<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & Canonical -->
    <title>Bulk Image Compressor | SocialMediaToolsHub (Fast & Private)</title>
    <meta name="description" content="Batch compress JPG, PNG, and WebP images instantly on SocialMediaToolsHub. Privacy-focused image optimization for Instagram, TikTok, and YouTube. No server uploads." />
    <link rel="canonical" href="https://socialmediatoolshub.com/bulk-image-compressor" />
    
    <!-- Social Meta Tags -->
    <meta property="og:title" content="Bulk Image Compressor | SocialMediaToolsHub">
    <meta property="og:description" content="Fast, bulk image compression that happens entirely in your browser. Perfect for social media creators.">
    <meta property="og:type" content="website">
    <meta property="twitter:card" content="summary_large_image">

    <!-- Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
        --accent-from: #38bdf8;
        --accent-to: #818cf8;
        --r-lg: 24px;
        --r-md: 16px;
        --trans: 260ms cubic-bezier(.2, .9, .3, 1);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
      .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
      
      /* Header */
      .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; text-decoration: none; }
      
      .brand-emoji {
        background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 28px;
        display: inline-block;
      }
      .logo-text { background: linear-gradient(90deg, var(--accent-from), var(--accent-to)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .topnav { display: flex; gap: 15px; }
      .topnav a { color: var(--muted); text-decoration: none; font-size: 14px; transition: 0.2s; }
      .topnav a:hover { color: white; }

      /* Hero */
      .hero { background: var(--card); border-radius: var(--r-lg); padding: 30px; margin: 20px 0; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
      .hero h1 { margin: 0; font-size: 24px; }
      .lead { color: var(--muted); margin: 10px 0 0; font-size: 16px; }

      /* Dropzone */
      .dropzone { 
        margin-top: 20px; border: 2px dashed var(--border); border-radius: var(--r-lg); 
        padding: 60px 20px; text-align: center; cursor: pointer; transition: var(--trans);
        background: rgba(255,255,255,0.02);
      }
      .dropzone:hover { border-color: var(--accent-from); background: rgba(255,255,255,0.05); }
      .dropzone h2 { margin: 10px 0; font-size: 20px; }
      .dropzone p { color: var(--muted); font-size: 14px; }

      /* Queue */
      .processing-container { margin-top: 30px; background: var(--card); border-radius: var(--r-md); border: 1px solid var(--border); overflow: hidden; }
      .processing-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
      .file-row { padding: 20px; border-bottom: 1px solid var(--border); transition: 0.2s; }
      .file-row:hover { background: rgba(255,255,255,0.02); }
      .file-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
      .file-meta { display: flex; align-items: center; gap: 12px; }
      .file-icon { font-size: 24px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; }
      .file-name { font-weight: 600; font-size: 14px; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .file-size { font-size: 12px; color: var(--muted); }

      /* Settings Bar */
      .settings-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; align-items: end; }
      .control { display: flex; flex-direction: column; gap: 5px; }
      .label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
      select, input[type="range"] { background: var(--bg); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 8px; width: 100%; outline: none; }
      
      /* Progress */
      .progress-bg { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; margin-top: 15px; overflow: hidden; }
      .progress-fill { height: 100%; background: var(--accent-from); transition: width 0.3s; }

      /* Buttons */
      .btn { padding: 12px 20px; border-radius: 12px; border: 0; font-weight: 700; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
      .btn-primary { background: linear-gradient(90deg, var(--accent-from), var(--accent-to)); color: #06121f; }
      .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }
      .btn-success { background: #10b981; color: white; }
      .btn-success:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }
      .btn-danger { background: transparent; color: #ef4444; padding: 5px; }
      
      /* Stats */
      .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--border); gap: 1px; }
      .stat { background: var(--card); padding: 15px; text-align: center; }
      .stat-val { display: block; font-size: 18px; font-weight: 800; }
      .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }

      /* Footer & Content */
      .content-area { max-width: 800px; margin: 40px auto; }
      .faq details { background: rgba(255,255,255,0.02); margin-bottom: 10px; padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
      .faq summary { cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; }
      .faq p { margin-top: 10px; color: var(--muted); font-size: 14px; }
      .grid-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
      .tool-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 15px; border-radius: 16px; text-decoration: none; color: inherit; transition: 0.2s; }
      .tool-card:hover { border-color: var(--accent-from); transform: translateY(-5px); }
      
      .share-row { text-align: center; margin: 40px 0; }
      .btn-whatsapp { background: #25D366; color: white; padding: 15px 30px; border-radius: 50px; text-decoration: none; font-weight: 800; display: inline-flex; align-items: center; gap: 10px; }

      footer { border-top: 1px solid var(--border); padding: 40px 0; text-align: center; color: var(--muted); font-size: 13px; }
      .footer-nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
      .footer-nav a { color: var(--muted); text-decoration: none; }
      .footer-nav a:hover { color: white; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useCallback, useRef } = React;

        const formatSize = (bytes) => {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        };

        const App = () => {
            const [files, setFiles] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const fileInputRef = useRef(null);

            const addFiles = (newFiles) => {
                const mapped = Array.from(newFiles).filter(f => f.type.startsWith('image/')).map(file => ({
                    id: Math.random().toString(36).substr(2, 9),
                    file,
                    name: file.name,
                    originalSize: file.size,
                    compressedSize: null,
                    compressedBlob: null,
                    status: 'pending',
                    progress: 0,
                    quality: 80,
                    format: 'image/jpeg',
                    targetSizeKb: 'auto'
                }));
                setFiles(prev => [...prev, ...mapped]);
            };

            const updateFile = (id, updates) => {
                setFiles(prev => prev.map(f => f.id === id ? { ...f, ...updates, status: 'pending', progress: 0 } : f));
            };

            const removeFile = (id) => setFiles(prev => prev.filter(f => f.id !== id));

            const compressSingle = async (item) => {
                updateFile(item.id, { status: 'processing', progress: 0 });
                try {
                    const options = {
                        maxSizeMB: item.targetSizeKb === 'auto' ? undefined : item.targetSizeKb / 1024,
                        initialQuality: item.quality / 100,
                        useWebWorker: true,
                        fileType: item.format,
                        onProgress: (p) => updateFile(item.id, { progress: p })
                    };
                    const out = await imageCompression(item.file, options);
                    updateFile(item.id, { 
                        status: 'completed', 
                        progress: 100, 
                        compressedSize: out.size, 
                        compressedBlob: out 
                    });
                } catch (e) {
                    console.error('Compression failed', e);
                    updateFile(item.id, { status: 'error' });
                }
            };

            const compressAll = async () => {
                if (files.length === 0) return;
                setIsProcessing(true);
                const pending = files.filter(f => f.status !== 'completed');
                for (const f of pending) {
                    await compressSingle(f);
                }
                setIsProcessing(false);
            };

            const downloadZip = async () => {
                if (typeof JSZip === 'undefined') {
                    alert('JSZip library not found. Please refresh page.');
                    return;
                }
                const zip = new JSZip();
                const completed = files.filter(f => f.status === 'completed' && f.compressedBlob);
                
                if (completed.length === 0) {
                    alert('No compressed files ready yet.');
                    return;
                }

                completed.forEach(f => {
                    const ext = f.format.split('/')[1] || 'jpg';
                    const base = f.name.substring(0, f.name.lastIndexOf('.')) || f.name;
                    zip.file(`smth-${base}.${ext}`, f.compressedBlob);
                });

                const content = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'socialmediatoolshub-bulk-optimized.zip';
                a.click();
                URL.revokeObjectURL(url);
            };

            const stats = useMemo(() => {
                const done = files.filter(f => f.status === 'completed');
                if (!done.length) return null;
                const orig = done.reduce((a, b) => a + b.originalSize, 0);
                const comp = done.reduce((a, b) => a + (b.compressedSize || 0), 0);
                return {
                    orig: formatSize(orig),
                    comp: formatSize(comp),
                    savings: ((1 - comp / orig) * 100).toFixed(1) + '%'
                };
            }, [files]);

            const hasCompleted = useMemo(() => files.some(f => f.status === 'completed'), [files]);

            return (
                <div className="container">
                    <header className="header">
                        <a href="/" className="brand">
                            <span className="brand-emoji">⚡</span>
                            <span className="logo-text">SocialMediaToolsHub</span>
                        </a>
                        <nav className="topnav">
                            <a href="/about-us">About Us</a>
                            <a href="/contact-us">Contact Us</a>
                        </nav>
                    </header>

                    <section className="hero">
                        <h1>Bulk Image Compressor</h1>
                        <p className="lead">Optimize your images for Social Media in seconds. Privacy-first: no files are uploaded to any server.</p>
                    </section>

                    <div 
                        className="dropzone" 
                        onDragOver={e => e.preventDefault()} 
                        onDrop={e => { e.preventDefault(); addFiles(e.dataTransfer.files); }}
                        onClick={() => fileInputRef.current.click()}
                    >
                        <input type="file" multiple accept="image/*" hidden ref={fileInputRef} onChange={e => addFiles(e.target.files)} />
                        <div style={{fontSize: '50px'}}>📸</div>
                        <h2>Drop images here or click to browse</h2>
                        <p>Supports JPG, PNG, WebP • Batch processing enabled</p>
                    </div>

                    {files.length > 0 && (
                        <div className="processing-container">
                            <div className="processing-header">
                                <div style={{fontWeight: 800}}>Queue: {files.length} items</div>
                                <div style={{display:'flex', gap:'10px', flexWrap:'wrap'}}>
                                    <button className="btn" style={{color:'var(--muted)'}} onClick={() => setFiles([])}>Clear All</button>
                                    <button className="btn btn-primary" onClick={compressAll} disabled={isProcessing}>
                                        {isProcessing ? 'Optimizing...' : 'Compress All 🚀'}
                                    </button>
                                    {hasCompleted && (
                                        <button className="btn btn-success" onClick={downloadZip}>Download All (ZIP) 📦</button>
                                    )}
                                </div>
                            </div>

                            {stats && (
                                <div className="stats-bar">
                                    <div className="stat"><span className="stat-label">Original Total</span><span className="stat-val">{stats.orig}</span></div>
                                    <div className="stat"><span className="stat-label">Optimized Total</span><span className="stat-val">{stats.comp}</span></div>
                                    <div className="stat"><span className="stat-label">Net Savings</span><span className="stat-val" style={{color:'var(--accent-from)'}}>{stats.savings}</span></div>
                                </div>
                            )}

                            <div className="queue-list">
                                {files.map(f => (
                                    <div key={f.id} className="file-row">
                                        <div className="file-main">
                                            <div className="file-meta">
                                                <div className="file-icon">🖼️</div>
                                                <div>
                                                    <div className="file-name">{f.name}</div>
                                                    <div className="file-size">
                                                        {formatSize(f.originalSize)} 
                                                        {f.compressedSize && <span style={{color:'var(--accent-from)', fontWeight:700}}> → {formatSize(f.compressedSize)}</span>}
                                                    </div>
                                                </div>
                                            </div>
                                            <div style={{display:'flex', gap:'15px', alignItems:'center'}}>
                                                {f.status === 'completed' && f.compressedBlob && (
                                                    <button 
                                                        className="btn btn-success" 
                                                        style={{padding:'6px 12px', fontSize:'12px', borderRadius:'8px'}}
                                                        onClick={() => {
                                                            const url = URL.createObjectURL(f.compressedBlob);
                                                            const a = document.createElement('a');
                                                            a.href = url;
                                                            const ext = f.format.split('/')[1] || 'jpg';
                                                            const base = f.name.substring(0, f.name.lastIndexOf('.')) || f.name;
                                                            a.download = `smth-${base}.${ext}`;
                                                            a.click();
                                                        }}
                                                    >
                                                        Download 💾
                                                    </button>
                                                )}
                                                <button className="btn-danger" onClick={() => removeFile(f.id)}>✕</button>
                                            </div>
                                        </div>

                                        <div className="settings-bar">
                                            <div className="control">
                                                <div className="label">Format</div>
                                                <select value={f.format} onChange={e => updateFile(f.id, { format: e.target.value })}>
                                                    <option value="image/jpeg">JPEG</option>
                                                    <option value="image/png">PNG</option>
                                                    <option value="image/webp">WebP</option>
                                                </select>
                                            </div>
                                            <div className="control">
                                                <div className="label">Target Size</div>
                                                <select value={f.targetSizeKb} onChange={e => updateFile(f.id, { targetSizeKb: e.target.value === 'auto' ? 'auto' : parseInt(e.target.value) })}>
                                                    <option value="auto">Auto Quality</option>
                                                    <option value="20">Under 20 KB</option>
                                                    <option value="50">Under 50 KB</option>
                                                    <option value="100">Under 100 KB</option>
                                                    <option value="200">Under 200 KB</option>
                                                    <option value="500">Under 500 KB</option>
                                                </select>
                                            </div>
                                            <div className="control">
                                                <div className="label">Quality ({f.quality}%)</div>
                                                <input type="range" min="1" max="100" value={f.quality} onChange={e => updateFile(f.id, { quality: e.target.value, targetSizeKb: 'auto' })} disabled={f.targetSizeKb !== 'auto'} />
                                            </div>
                                            <button className="btn btn-primary" style={{height:'38px', padding:'0 15px'}} onClick={() => compressSingle(f)} disabled={f.status === 'processing'}>
                                                {f.status === 'processing' ? '...' : 'Go ⚡'}
                                            </button>
                                        </div>
                                        
                                        {f.status === 'processing' && (
                                            <div className="progress-bg"><div className="progress-fill" style={{width: `${f.progress}%`}}></div></div>
                                        )}
                                        {f.status === 'completed' && (
                                            <div style={{textAlign:'right', marginTop:'10px', fontSize:'11px', color:'var(--muted)'}}>
                                                Optimization complete.
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="share-row">
                        <a href="#" className="btn-whatsapp" onClick={(e) => {
                            e.preventDefault();
                            const url = encodeURIComponent(window.location.href);
                            window.open(`https://wa.me/?text=Check out the Bulk Image Compressor on SocialMediaToolsHub: ${url}`, '_blank');
                        }}>
                            <span>Share SocialMediaToolsHub</span>
                        </a>
                    </div>

                    <div className="content-area">
                        <h3>How to use the SocialMediaToolsHub Bulk Compressor</h3>
                        <p>Batch optimize your visual assets for social platforms like Instagram and TikTok without compromising on quality.</p>
                        <div className="faq">
                            <details open>
                                <summary>1. Select Your Images <span style={{color:'var(--muted)'}}>›</span></summary>
                                <p>Drag and drop your images into the zone above. We support JPG, PNG, and WebP for bulk processing.</p>
                            </details>
                            <details>
                                <summary>2. Adjust Your Settings <span style={{color:'var(--muted)'}}>›</span></summary>
                                <p>Set quality manually or pick a target size like "Under 50 KB". Our smart algorithm handles the rest locally.</p>
                            </details>
                            <details>
                                <summary>3. Process and Save <span style={{color:'var(--muted)'}}>›</span></summary>
                                <p>Click "Compress All" and download individual files or the whole batch as a single ZIP file.</p>
                            </details>
                        </div>

                        <h3 style={{marginTop:'40px'}}>More Creator Tools</h3>
                        <div className="grid-tools">
                            <a href="#" className="tool-card"><strong>🧾 Caption Counter</strong><p>Character, word and line counters.</p></a>
                            <a href="#" className="tool-card"><strong>🎯 Safe Zone Overlay</strong><p>Preview Reels, Shorts & posts.</p></a>
                        </div>

                        <h3 style={{marginTop:'40px'}}>Frequently Asked Questions</h3>
                        <div className="faq">
                            <details><summary>Is this tool private? <span>›</span></summary><p>Yes! 100% of the compression happens inside your browser. No files are ever uploaded to any server.</p></details>
                            <details><summary>What formats are supported? <span>›</span></summary><p>We support JPG, PNG, and WebP for input and output. You can convert between them freely.</p></details>
                        </div>
                    </div>

                    <footer>
                        <div className="footer-nav">
                            <a href="/about-us">About Us</a>
                            <a href="/contact-us">Contact</a>
                            <a href="/privacy-policy">Privacy Policy</a>
                            <a href="/terms-of-service">Terms of Service</a>
                            <a href="/cookie-policy">Cookie Policy</a>
                        </div>
                        <div style={{color: '#475569'}}>© 2025 SocialMediaToolsHub. Built for speed.</div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
