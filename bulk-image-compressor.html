    <style>

      /* Settings Bar */

      /* Buttons */

      .faq summary { cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; }
      .faq p { margin-top: 10px; color: var(--muted); font-size: 14px; }

      footer { border-top: 1px solid var(--border); padding: 40px 0; text-align: center; color: var(--muted); font-size: 13px; }
      .footer-nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useCallback, useRef, useEffect } = React;

        const formatSize = (bytes) => {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        };

        const App = () => {
            const [files, setFiles] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const fileInputRef = useRef(null);

            // Dynamic Page Titles for specific tasks
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const task = params.get('task');
                
                if (task === '20kb') {
                    document.title = "Compress Image to 20KB Online - Fast & Free";
                    const h1 = document.querySelector('h1');
                    if(h1) h1.innerText = "Compress Images to 20KB";
                } else if (task === 'webp-to-png') {
                    document.title = "Convert WebP to PNG Online - Bulk Converter";
                    const h1 = document.querySelector('h1');
                    if(h1) h1.innerText = "WebP to PNG Converter";
                }
            }, []);

            const addFiles = (newFiles) => {
                const mapped = Array.from(newFiles).filter(f => f.type.startsWith('image/')).map(file => ({
                    id: Math.random().toString(36).substr(2, 9),
                    file,
                    name: file.name,
                    originalSize: file.size,
                    compressedSize: null,
                    compressedBlob: null,
                    status: 'pending', // pending, processing, completed, error, warning
                    progress: 0,
                    quality: 80,
                    format: 'image/jpeg',
                    targetSizeKb: 'auto'
                }));
                setFiles(prev => [...prev, ...mapped]);
            };

            const updateFile = (id, updates) => {
                setFiles(prev => prev.map(f => f.id === id ? { ...f, ...updates } : f));
            };

            const removeFile = (id) => setFiles(prev => prev.filter(f => f.id !== id));

            const compressSingle = async (item, forceResize = false) => {
                updateFile(item.id, { status: 'processing', progress: 0 });
                try {
                    let dynamicMaxWidth = undefined;

                    // If "Force Resize" is clicked OR user sets specific limit, we use logic
                    if (forceResize) {
                        // Aggressive resizing to guarantee size drop
                        if (item.targetSizeKb <= 20) dynamicMaxWidth = 600;
                        else if (item.targetSizeKb <= 50) dynamicMaxWidth = 800;
                        else dynamicMaxWidth = 1000;
                    }

                    const options = {
                        maxSizeMB: item.targetSizeKb === 'auto' ? undefined : item.targetSizeKb / 1024,
                        initialQuality: item.quality / 100,
                        useWebWorker: true,
                        fileType: item.format,
                        maxWidthOrHeight: dynamicMaxWidth,
                        onProgress: (p) => updateFile(item.id, { progress: p })
                    };

                    const out = await imageCompression(item.file, options);
                    
                    // Logic Check: Did we meet the target?
                    let newStatus = 'completed';
                    if (!forceResize && item.targetSizeKb !== 'auto') {
                        const sizeKB = out.size / 1024;
                        // If result is > target by 10% tolerance, show warning
                        if (sizeKB > (item.targetSizeKb * 1.1)) {
                            newStatus = 'warning';
                        }
                    }

                    updateFile(item.id, { 
                        status: newStatus, 
                        progress: 100, 
                        compressedSize: out.size, 
                        compressedBlob: out 
                    });
                } catch (e) {
                    console.error('Compression failed', e);
                    updateFile(item.id, { status: 'error' });
                }
            };

            const compressAll = async () => {
                if (files.length === 0) return;
                setIsProcessing(true);
                const pending = files.filter(f => f.status !== 'completed' && f.status !== 'warning');
                for (const f of pending) {
                    await compressSingle(f);
                }
                setIsProcessing(false);
            };

            const downloadZip = async () => {
                if (typeof JSZip === 'undefined') {
                    alert('JSZip library not found. Please refresh page.');
                    return;
                }
                const zip = new JSZip();
                const completed = files.filter(f => (f.status === 'completed' || f.status === 'warning') && f.compressedBlob);
                
                if (completed.length === 0) {
                    alert('No compressed files ready yet.');
                    return;
                }

                completed.forEach(f => {
                    const ext = f.format.split('/')[1] || 'jpg';
                    const base = f.name.substring(0, f.name.lastIndexOf('.')) || f.name;
                    zip.file(`smth-${base}.${ext}`, f.compressedBlob);
                });

                const content = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'socialmediatoolshub-bulk-optimized.zip';
                a.click();
                URL.revokeObjectURL(url);
            };

            const stats = useMemo(() => {
                const done = files.filter(f => f.status === 'completed' || f.status === 'warning');
                if (!done.length) return null;
                const orig = done.reduce((a, b) => a + b.originalSize, 0);
                const comp = done.reduce((a, b) => a + (b.compressedSize || 0), 0);
                return {
                    orig: formatSize(orig),
                    comp: formatSize(comp),
                    savings: ((1 - comp / orig) * 100).toFixed(1) + '%'
                };
            }, [files]);

            const hasCompleted = useMemo(() => files.some(f => f.status === 'completed' || f.status === 'warning'), [files]);

            return (
                <div className="container">
                    <header className="header">
                        <a href="/" className="brand">
                            <span className="brand-emoji">⚡</span>
                            <span className="logo-text">SocialMediaToolsHub</span>
                        </a>
                        <nav className="topnav">
                            <a href="/about-us">About Us</a>
                            <a href="/contact-us">Contact Us</a>
                        </nav>
                    </header>

                    <section className="hero">
                        <h1>Bulk Image Compressor & Converter (20KB, 50KB)</h1>
                        <p className="lead">Optimize your images for Social Media in seconds. Privacy-first: no files are uploaded to any server.</p>
                    </section>

                    <div 
                        className="dropzone" 
                        onDragOver={e => e.preventDefault()} 
                        onDrop={e => { e.preventDefault(); addFiles(e.dataTransfer.files); }}
                        onClick={() => fileInputRef.current.click()}
                    >
                        <input type="file" multiple accept="image/*" hidden ref={fileInputRef} onChange={e => addFiles(e.target.files)} />
                        <div style={{fontSize: '50px'}}>📸</div>
                        <h2>Drop images here or click to browse</h2>
                        <p>Supports JPG, PNG, WebP • Batch processing enabled</p>
                    </div>

                    {files.length > 0 && (
                        <div className="processing-container">
                            <div className="processing-header">
                                <div style={{fontWeight: 800}}>Queue: {files.length} items</div>
                                <div style={{display:'flex', gap:'10px', flexWrap:'wrap'}}>
                                    <button className="btn" style={{color:'var(--muted)'}} onClick={() => setFiles([])}>Clear All</button>
                                    <button className="btn btn-primary" onClick={compressAll} disabled={isProcessing}>
                                        {isProcessing ? 'Optimizing...' : 'Compress All 🚀'}
                                    </button>
                                    {hasCompleted && (
                                        <button className="btn btn-success" onClick={downloadZip}>Download All (ZIP) 📦</button>
                                    )}
                                </div>
                            </div>

                            {stats && (
                                <div className="stats-bar">
                                    <div className="stat"><span className="stat-label">Original Total</span><span className="stat-val">{stats.orig}</span></div>
                                    <div className="stat"><span className="stat-label">Optimized Total</span><span className="stat-val">{stats.comp}</span></div>
                                    <div className="stat"><span className="stat-label">Net Savings</span><span className="stat-val" style={{color:'var(--accent-from)'}}>{stats.savings}</span></div>
                                </div>
                            )}

                            <div className="queue-list">
                                {files.map(f => (
                                    <div key={f.id} className="file-row">
                                        <div className="file-main">
                                            <div className="file-meta">
                                                <div className="file-icon">
                                                    {f.status === 'warning' ? '⚠️' : '🖼️'}
                                                </div>
                                                <div>
                                                    <div className="file-name">{f.name}</div>
                                                    <div className="file-size">
                                                        {formatSize(f.originalSize)} 
                                                        {f.compressedSize && <span style={{color: f.status === 'warning' ? '#f59e0b' : 'var(--accent-from)', fontWeight:700}}> → {formatSize(f.compressedSize)}</span>}
                                                    </div>
                                                </div>
                                            </div>
                                            <div style={{display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap', justifyContent:'flex-end', marginLeft:'auto'}}>
                                                {f.status === 'warning' && (
                                                    <div style={{display:'flex', gap:'10px', alignItems:'center'}}>
                                                        <span style={{fontSize:'12px', color:'var(--warning)'}}>Missed Target</span>
                                                        <button className="btn btn-warning" onClick={() => compressSingle(f, true)}>Force Resize 📉</button>
                                                    </div>
                                                )}

                                                {(f.status === 'completed' || f.status === 'warning') && f.compressedBlob && (
                                                    <button 
                                                        className="btn btn-success" 
                                                        style={{padding:'6px 12px', fontSize:'12px', borderRadius:'8px'}}
                                                        onClick={() => {
                                                            const url = URL.createObjectURL(f.compressedBlob);
                                                            const a = document.createElement('a');
                                                            a.href = url;
                                                            const ext = f.format.split('/')[1] || 'jpg';
                                                            const base = f.name.substring(0, f.name.lastIndexOf('.')) || f.name;
                                                            a.download = `smth-${base}.${ext}`;
                                                            a.click();
                                                        }}
                                                    >
                                                        Download 💾
                                                    </button>
                                                )}
                                                <button className="btn-danger" onClick={() => removeFile(f.id)}>✕</button>
                                            </div>
                                        </div>

                                        <div className="settings-bar">
                                            <div className="control">
                                                <div className="label">Format</div>
                                                <select value={f.format} onChange={e => updateFile(f.id, { format: e.target.value, status: 'pending', progress: 0 })}>
                                                    <option value="image/jpeg">JPEG</option>
                                                    <option value="image/png">PNG</option>
                                                    <option value="image/webp">WebP</option>
                                                </select>
                                            </div>
                                            <div className="control">
                                                <div className="label">Target Size</div>
                                                <select value={f.targetSizeKb} onChange={e => updateFile(f.id, { targetSizeKb: e.target.value === 'auto' ? 'auto' : parseInt(e.target.value), status: 'pending', progress: 0 })}>
                                                    <option value="auto">Auto Quality</option>
                                                    <option value="20">Under 20 KB</option>
                                                    <option value="50">Under 50 KB</option>
                                                    <option value="100">Under 100 KB</option>
                                                    <option value="200">Under 200 KB</option>
                                                    <option value="500">Under 500 KB</option>
                                                </select>
                                            </div>
                                            <div className="control">
                                                <div className="label">Quality ({f.quality}%)</div>
                                                <input type="range" min="1" max="100" value={f.quality} onChange={e => updateFile(f.id, { quality: e.target.value, targetSizeKb: 'auto', status: 'pending', progress: 0 })} disabled={f.targetSizeKb !== 'auto'} />
                                            </div>
                                            <button className="btn btn-primary" style={{height:'38px', padding:'0 15px'}} onClick={() => compressSingle(f)} disabled={f.status === 'processing'}>
                                                {f.status === 'processing' ? '...' : 'Go ⚡'}
                                            </button>
                                        </div>
                                        
                                        {f.status === 'processing' && (
                                            <div className="progress-bg"><div className="progress-fill" style={{width: `${f.progress}%`}}></div></div>
                                        )}
                                        {f.status === 'completed' && (
                                            <div style={{textAlign:'right', marginTop:'10px', fontSize:'11px', color:'var(--muted)'}}>
                                                Optimization complete.
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="share-row">
                        <a href="#" className="btn-whatsapp" onClick={(e) => {
                            e.preventDefault();
                            const url = encodeURIComponent(window.location.href);
                            window.open(`https://wa.me/?text=Check out the Bulk Image Compressor on SocialMediaToolsHub: ${url}`, '_blank');
                        }}>
                            <span>Share SocialMediaToolsHub</span>
                        </a>
                    </div>

                    <div className="content-area">
                        <h3>How to use the Bulk Compressor</h3>
                        <p>Batch optimize your visual assets for social platforms like Instagram and TikTok without compromising on quality.</p>
                        
                        <div className="steps-grid">
                            <div className="step-card">
                                <span className="step-head">1. Select Images</span>
                                <p className="step-desc">Drag and drop your images into the zone above. We support JPG, PNG, and WebP for bulk processing.</p>
                            </div>
                            <div className="step-card">
                                <span className="step-head">2. Adjust Settings</span>
                                <p className="step-desc">Set quality manually or pick a target size like "Under 50 KB". Our smart algorithm handles the rest.</p>
                            </div>
                            <div className="step-card">
                                <span className="step-head">3. Process & Save</span>
                                <p className="step-desc">Click "Compress All" and download individual files or the whole batch as a single ZIP file.</p>
                            </div>
                        </div>

                        <div className="info-block">
