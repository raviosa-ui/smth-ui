<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TinyPixel | Professional Bulk Image Optimizer</title>
  <meta name="description" content="TinyPixel: Optimize and convert multiple images instantly in your browser. 100% private, no server uploads. Fast, free, and secure." />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f1a;
      --surface: #111827;
      --text: #ffffff;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --trans: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg) !important;
      color: var(--text);
      margin: 0;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
    }

    /* Custom Range Input */
    input[type=range] { -webkit-appearance: none; background: transparent; cursor: pointer; width: 100%; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid #fff;
      margin-top: -8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    /* Drag and Drop animations */
    .drop-zone {
      transition: var(--trans);
      border: 2px dashed rgba(255, 255, 255, 0.1);
    }
    .drop-zone.dragging {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.05);
      transform: scale(1.01);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      transition: var(--trans);
    }
    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
    }

    .file-row {
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: var(--trans);
    }
    .file-row:hover {
      border-color: rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.02);
    }

    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.0.0",
      "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
      "htm": "https://esm.sh/htm@3.1.1"
    }
  }
  </script>
</head>

<body class="selection:bg-blue-500/30 selection:text-white">
  <div id="root"></div>

  <script type="module">
    import React, { useState, useCallback, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import htm from 'htm';

    const html = htm.bind(React.createElement);

    // --- Helpers ---
    const formatBytes = (bytes, decimals = 2) => {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    };

    // --- Components ---

    const DropZone = ({ onFilesAdded }) => {
      const [isDragging, setIsDragging] = useState(false);
      const inputRef = useRef();

      return html`
        <div 
          class=${`drop-zone relative glass-card p-12 text-center cursor-pointer group ${isDragging ? 'dragging' : ''}`}
          onDragOver=${(e) => { e.preventDefault(); setIsDragging(true); }}
          onDragLeave=${() => setIsDragging(false)}
          onDrop=${(e) => { 
            e.preventDefault(); 
            setIsDragging(false); 
            if (e.dataTransfer.files.length) onFilesAdded(e.dataTransfer.files); 
          }}
          onClick=${() => inputRef.current.click()}
        >
          <input 
            type="file" 
            multiple 
            accept="image/*" 
            ref=${inputRef}
            class="hidden" 
            onChange=${e => { if (e.target.files.length) onFilesAdded(e.target.files); }} 
          />
          <div class="flex flex-col items-center">
            <div class=${`w-20 h-20 rounded-2xl flex items-center justify-center mb-6 transition-all duration-300 ${isDragging ? 'bg-blue-600 rotate-6' : 'bg-white/5 group-hover:bg-white/10 group-hover:scale-110'}`}>
              <svg class="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </div>
            <h2 class="text-3xl font-extrabold tracking-tight mb-2">Optimize your images</h2>
            <p class="text-gray-400 max-w-sm mb-8">Drop your files here, or click to browse. JPEG, PNG, and WebP supported.</p>
            <div class="btn-primary px-8 py-3 rounded-xl font-bold text-sm shadow-xl">
              Select Files
            </div>
          </div>
        </div>
      `;
    };

    const FileRow = ({ file, onUpdate, onRemove, onDownload }) => {
      const reduction = file.compressedSize 
        ? Math.round(((file.originalSize - file.compressedSize) / file.originalSize) * 100)
        : 0;

      return html`
        <div class="file-row bg-white/5 rounded-3xl p-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
          <div class="flex flex-col lg:flex-row lg:items-center gap-8">
            <!-- File Info -->
            <div class="flex-1 min-w-0 flex items-center gap-5">
              <div class="w-16 h-16 bg-white/5 rounded-2xl flex items-center justify-center flex-shrink-0">
                <svg class="w-8 h-8 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
              </div>
              <div class="min-w-0">
                <h4 class="text-base font-bold truncate mb-1" title=${file.originalFile.name}>${file.originalFile.name}</h4>
                <div class="flex items-center gap-3 text-xs font-semibold tracking-wide">
                  <span class="text-gray-500">${formatBytes(file.originalSize)}</span>
                  ${file.status === 'completed' && html`
                    <span class="text-blue-500">→ ${formatBytes(file.compressedSize)}</span>
                    <span class="bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded-lg">-${reduction}%</span>
                  `}
                </div>
              </div>
            </div>

            <!-- Settings -->
            <div class="flex flex-wrap items-center gap-8 lg:border-l border-white/5 lg:pl-8">
              <div class="w-44">
                <div class="flex justify-between items-center mb-3">
                  <label class="text-[10px] uppercase font-black text-gray-500 tracking-widest">Quality</label>
                  <span class="text-xs font-bold text-blue-400">${file.settings.quality}%</span>
                </div>
                <input 
                  type="range" 
                  min="1" 
                  max="100" 
                  value=${file.settings.quality} 
                  onChange=${e => onUpdate(file.id, { quality: parseInt(e.target.value) })} 
                />
              </div>

              <div class="w-28">
                <label class="text-[10px] uppercase font-black text-gray-500 tracking-widest block mb-2">Format</label>
                <select 
                  value=${file.settings.format} 
                  onChange=${e => onUpdate(file.id, { format: e.target.value })} 
                  class="w-full bg-white/5 border border-white/10 text-white rounded-xl text-xs font-bold py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
                >
                  <option value="image/jpeg">JPEG</option>
                  <option value="image/png">PNG</option>
                  <option value="image/webp">WEBP</option>
                </select>
              </div>

              <div class="flex gap-2">
                <button 
                  onClick=${() => onDownload(file)} 
                  disabled=${file.status !== 'completed'} 
                  class="h-12 w-12 flex items-center justify-center bg-blue-600 text-white rounded-2xl disabled:opacity-20 disabled:cursor-not-allowed transition-all hover:brightness-110 active:scale-90"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                </button>
                <button 
                  onClick=${() => onRemove(file.id)} 
                  class="h-12 w-12 flex items-center justify-center bg-red-500/10 text-red-400 rounded-2xl hover:bg-red-500 hover:text-white transition-all active:scale-90"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Progress Bar -->
          ${(file.status === 'processing' || file.status === 'pending') && html`
            <div class="mt-6 w-full bg-white/5 rounded-full h-1 overflow-hidden">
              <div 
                class="bg-blue-500 h-full transition-all duration-500 ease-out shadow-[0_0_8px_rgba(59,130,246,0.5)]"
                style="width: ${file.progress}%"
              />
            </div>
          `}
        </div>
      `;
    };

    const App = () => {
      const [files, setFiles] = useState([]);
      const processingQueue = useRef(new Set());

      const handleFilesAdded = (fileList) => {
        const fresh = Array.from(fileList).map(f => ({
          id: Math.random().toString(36).substr(2, 9),
          originalFile: f,
          compressedBlob: null,
          status: 'pending',
          progress: 0,
          settings: { quality: 80, format: f.type || 'image/jpeg' },
          originalSize: f.size,
          compressedSize: null,
        }));
        setFiles(prev => [...fresh, ...prev]);
      };

      const updateSettings = (id, updates) => {
        setFiles(prev => prev.map(f => f.id === id ? { 
          ...f, 
          settings: { ...f.settings, ...updates }, 
          status: 'pending', 
          progress: 0,
          compressedBlob: null,
          compressedSize: null 
        } : f));
      };

      const compressFile = async (id, file, settings) => {
        try {
          const options = {
            maxSizeMB: 10,
            maxWidthOrHeight: 4096,
            useWebWorker: true,
            initialQuality: settings.quality / 100,
            fileType: settings.format,
            onProgress: (p) => setFiles(prev => prev.map(f => f.id === id ? { ...f, progress: p } : f))
          };
          const blob = await window.imageCompression(file, options);
          setFiles(prev => prev.map(f => f.id === id ? { 
            ...f, 
            status: 'completed', 
            compressedBlob: blob, 
            compressedSize: blob.size, 
            progress: 100 
          } : f));
        } catch (e) {
          console.error(e);
          setFiles(prev => prev.map(f => f.id === id ? { ...f, status: 'error' } : f));
        } finally {
          processingQueue.current.delete(id);
        }
      };

      useEffect(() => {
        const next = files.find(f => f.status === 'pending' && !processingQueue.current.has(f.id));
        if (next) {
          processingQueue.current.add(next.id);
          setFiles(prev => prev.map(f => f.id === next.id ? { ...f, status: 'processing' } : f));
          compressFile(next.id, next.originalFile, next.settings);
        }
      }, [files]);

      const downloadZip = async () => {
        const zip = new window.JSZip();
        files.filter(f => f.status === 'completed' && f.compressedBlob).forEach(f => {
          const ext = f.settings.format.split('/')[1];
          const name = f.originalFile.name.replace(/\.[^/.]+$/, "") + `_tinypixel.${ext}`;
          zip.file(name, f.compressedBlob);
        });
        const content = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = `tinypixel_bulk_${Date.now()}.zip`;
        a.click();
      };

      const totalFiles = files.length;
      const completedFiles = files.filter(f => f.status === 'completed').length;
      const allDone = totalFiles > 0 && completedFiles === totalFiles;

      return html`
        <div class="min-h-screen pb-20">
          <header class="h-20 border-b border-white/5 sticky top-0 bg-gray-900/80 backdrop-blur-xl z-50">
            <div class="max-w-5xl mx-auto px-6 h-full flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black shadow-lg shadow-blue-500/20">T</div>
                <h1 class="text-xl font-black italic tracking-tighter">TinyPixel</h1>
              </div>
              <div class="flex items-center gap-6">
                <span class="text-[10px] font-black text-gray-500 bg-white/5 px-2 py-1 rounded uppercase tracking-[0.2em] hidden sm:block">Bulk Processor v1.0</span>
                <a href="https://github.com" target="_blank" class="text-gray-500 hover:text-white transition-colors">
                  <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                </a>
              </div>
            </div>
          </header>

          <main class="max-w-5xl mx-auto px-6 py-12">
            <section class="mb-12">
              <${DropZone} onFilesAdded=${handleFilesAdded} />
            </section>

            ${totalFiles > 0 ? html`
              <section class="animate-in fade-in duration-700">
                <div class="flex items-center justify-between mb-8 pb-6 border-b border-white/5">
                  <div class="flex items-baseline gap-3">
                    <h3 class="text-2xl font-black">Queue</h3>
                    <span class="text-sm font-bold text-gray-500">${totalFiles} items</span>
                  </div>
                  <div class="flex gap-4">
                    <button 
                      onClick=${() => setFiles([])} 
                      class="px-4 py-2 text-sm font-black text-gray-500 hover:text-white transition-colors tracking-widest uppercase"
                    >
                      Clear
                    </button>
                    <button 
                      onClick=${downloadZip} 
                      disabled=${!files.some(f => f.status === 'completed')} 
                      class="btn-primary px-6 py-2 rounded-xl font-bold text-sm disabled:opacity-20 disabled:cursor-not-allowed"
                    >
                      Download All (ZIP)
                    </button>
                  </div>
                </div>

                <div class="grid gap-4">
                  ${files.map(f => html`<${FileRow} 
                    key=${f.id} 
                    file=${f} 
                    onUpdate=${updateSettings} 
                    onRemove=${id => setFiles(prev => prev.filter(x => x.id !== id))} 
                    onDownload=${file => {
                      const url = URL.createObjectURL(file.compressedBlob);
                      const a = document.createElement('a');
                      a.href = url;
                      const ext = file.settings.format.split('/')[1];
                      a.download = file.originalFile.name.replace(/\.[^/.]+$/, "") + `_tinypixel.${ext}`;
                      a.click();
                      URL.revokeObjectURL(url);
                    }} 
                  />`)}
                </div>
              </section>
            ` : html`
              <div class="mt-20 text-center opacity-30 select-none">
                <div class="w-20 h-20 border-2 border-dashed border-white/20 rounded-3xl mx-auto mb-6 flex items-center justify-center">
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
                </div>
                <p class="font-bold tracking-widest uppercase text-xs">Add images to process</p>
              </div>
            `}
          </main>

          <footer class="mt-20 py-12 text-center">
            <p class="text-[10px] font-black text-gray-600 uppercase tracking-[0.4em] mb-4">100% Client-Side Processing • TinyPixel v1.0 • Secure</p>
            <div class="flex justify-center gap-8 text-xs font-bold text-gray-500">
              <span class="hover:text-blue-400 cursor-pointer">About</span>
              <span class="hover:text-blue-400 cursor-pointer">Support</span>
              <span class="hover:text-blue-400 cursor-pointer">Terms</span>
            </div>
          </footer>
        </div>
      `;
    };

    const root = createRoot(document.getElementById('root'));
    root.render(html`<${App} />`);
  </script>
</body>
</html>
